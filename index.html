r Aadhaar is linked to money laundering and she is under 'digital arrest'. He tells her to move Rs 18 lakh to an 'RBI account' and, if the bank asks, to say it's for her son's flat. Today the bank's pop-up asks 'Are you sure?' and she taps Yes. With our agent, a calm voice asks which builder, offers to call her son, and hears a man's voice in the background. The money stays on hold and her son is alerted.",before:["Scammer coaches her on a video call","Bank flags the Rs 18 lakh transfer","Pop-up says 'Are you sure?'; she taps Yes","Money vanishes through mule accounts in minutes"],breakAt:[2],after:["Bank flags and holds the transfer","AI agent talks to her in Marathi","Spots coaching: vague answers, 'don't tell my son', a second voice","Keeps the hold, alerts her son and the fraud team, saves the evidence"],fixAt:[1,2,3],how:["Bank holds a risky payment","Agent starts a voice check in her language","Checks her answers against bank data","A clear rulebook decides","Analyst approves; evidence saved"],tools:[{name:"Gemini Live (gemini-3.8-live)",does:"The AI voice that listens and talks in real time, in Hindi, Marathi, Tamil, Japanese, Korean and more"},{name:"Gemini 3.8 Flash",does:"Reads the conversation and explains which warning signs it heard"},{name:"ADK (Agent Development Kit)",does:"Google's framework for building the agent and its steps"},{name:"Cloud Run",does:"Hosts our app and the live voice connection"},{name:"Pub/Sub",does:"Passes 'payment held' events from the bank system to our agent"},{name:"BigQuery",does:"Stores evidence records and our library of scam scripts"},{name:"Firestore",does:"App data: customers, holds, decisions"},{name:"Model Armor",does:"Blocks attempts to trick the AI with injected instructions"}],data:"All synthetic, so nothing can block us: fake transactions (PaySim / IBM AMLSim) with scam patterns added, and about 200 scripted conversations (coached vs genuine) written from real news cases.",build:["Bank console: a list of held payments with their warning signs (a mock risk engine)","Voice agent: a Gemini Live session with our scam playbook as its instructions","Decision: a points table turns the answers into release / keep hold / call family / call police","Evidence: one-click PDF with the transcript, reasons and timestamps","Proof: run 200 test conversations and report how many coached cases we catch compared with a pop-up"],competition:"Medium",difficulty:"Medium",wow:"High",similar:"Westpac SaferPay (Australia, tap-based questions in English), Starling (UK, built on Gemini, the customer has to start it), and 'Second Voice' (a UK hackathon entry). None in Indian or Asian languages, none for bank branches, none mapped to RBI's new rules.",watchOut:"Test voice quality in Marathi and Hindi on day 1. Don't claim it saves everyone: its job is to catch coaching and escalate early with evidence.",verdict:"Clearest problem, best demo, and new rules in India (from Jan 2027), Korea and Australia push banks to do exactly this. Everything runs on synthetic data, so no outside approval can hold us up.",arch:[{title:"Bank risk system (mock)",sub:"Flags and holds a payment"},{title:"Pub/Sub",sub:"Sends the 'payment held' event"},{title:"Voice agent on Cloud Run",sub:"ADK + Gemini Live talks to the customer"},{title:"Gemini 3.8 Flash",sub:"Scores warning signs against the scam playbook"},{title:"Rules + analyst console",sub:"Decision with one-click approval"},{title:"BigQuery + PDF",sub:"Evidence record for the bank"}],demo:[{t:"0:00-0:15",line:"A staged clip: the fake officer coaching Shalini on a video call."},{t:"0:15-0:25",line:"Today: the pop-up, she taps Yes, the money splits across accounts. Caption: 'Rs 3 crore left one mule account in 29 minutes'."},{t:"0:25-0:35",line:"Rewind. Our bank console shows the warning signs and holds the payment."},{t:"0:35-1:15",line:"The agent speaks Marathi (English subtitles): purpose, builder, 'may I call Rohan?', 'is anyone on a call with you?'. A second voice is heard; the risk meter climbs."},{t:"1:15-1:30",line:"Recommendation: keep the hold 24 hours, call her son, pre-filled police referral. The analyst approves with one click; the evidence PDF appears."}],plan:[{t:"Fri Oct 9",line:"Pick the idea; Google Cloud project and billing; test Gemini Live in Hindi and Marathi; create the repo"},{t:"Sat Oct 10",line:"Skeleton deployed on Cloud Run; mock bank console with held payments; write the scam playbook"},{t:"Sun Oct 11",line:"Team list locks. Voice agent v1 (English + Hindi) answering on a held payment"},{t:"Mon-Tue Oct 12-13",line:"Rules table and analyst approval; coaching signals; evidence PDF"},{t:"Wed Oct 14",line:"Marathi and a Singapore version; recovery pack if time allows"},{t:"Thu Oct 15",line:"Run 200 test conversations; fix failures; get the numbers for the deck"},{t:"Fri Oct 16",line:"Record the 3-minute video; write the deck and README"},{t:"Sat Oct 17",line:"Submit, then freeze the repo"}]},{id:"vkyc",track:"bfsi",pick:"Strong backup",title:"Catch fake account openings in video-KYC calls",problem:"Scam gangs open 'mule' bank accounts by coaching people through the bank's video-KYC call. Banks check only a sample of recordings by hand. Investigators found 8.5 lakh mule accounts across 700+ branches.",solution:"AI reviews every recorded KYC call, flags coaching (someone prompting off-camera, scripted answers), and links calls that share the same room, voice or device across 'different' people.",story:"Three 'different' people open accounts on three different days. Each one passes the live checks. Our AI notices the same poster on the wall behind all three and the same off-camera voice whispering answers, and flags them together as a likely mule factory.",before:["Applicant joins the video-KYC call","Agent checks face and documents","A few recordings are audited by hand weeks later","Coached mule accounts go live and receive scam money"],breakAt:[2,3],after:["Every recording is reviewed by AI","Checklist checked with timestamps","Coaching signs flagged","Same room / voice / device linked across applicants"],fixAt:[1,2,3],how:["KYC recording uploaded","Gemini watches and checks the RBI checklist","Looks for prompting and scripted answers","Matches rooms and voices across sessions","Auditor reviews the flagged cases"],tools:[{name:"Gemini 3.8 Flash (video understanding)",does:"Watches the recording and checks each rule with timestamps"},{name:"BigQuery vector search",does:"Finds sessions with similar rooms, voices or devices"},{name:"Cloud Storage",does:"Holds the recordings"},{name:"Cloud Run + Firestore",does:"Auditor dashboard and case data"}],data:"No public KYC videos exist, so we would record about 20 scripted sessions ourselves (some coached).",build:["Record scripted sessions","Checklist review with timestamps","Coaching detector (second voice, off-screen reading)","Cross-session matching","Auditor dashboard"],competition:"Low",difficulty:"Hard",wow:"Medium",similar:"Deepfake detectors exist (HyperVerge, IDfy). An auditor for coaching and cross-applicant linking doesn't.",watchOut:"Needs our own videos; less emotional demo than the scam-hold idea. Don't sell it as a deepfake detector.",verdict:"Open space with a clear rule behind it (RBI: any prompting during video-KYC means rejection). Good backup if the team prefers it."},{id:"recover",track:"bfsi",pick:"Possible",title:"Help scam victims get their money back",problem:"After a scam, victims must report fast to several places with scattered evidence. In India only about 0.3% of reported losses come back.",solution:"An AI assistant on WhatsApp turns screenshots, bank SMS and a voice note into a ready-to-file complaint pack within the first hour.",story:"Imran, 41, in Lucknow sent Rs 2.6 lakh by UPI to a fake 'courier customs' caller 25 minutes ago. He forwards his bank SMS and chat screenshots and speaks in Hindi. In 10 minutes he has a 1930 call script, a pre-filled cybercrime complaint with the transaction IDs, and a letter for his bank.",before:["Calls 1930: busy, 2-3 tries","Fills separate forms for bank, portal and police","Missing transaction IDs delay freezing the scammer's account","Waits months; almost nothing returns"],breakAt:[1,2],after:["Sends screenshots and a voice note","AI pulls out transaction IDs, amounts, accounts","Gets a pre-filled complaint, call script and bank letter","Deadline reminders"],fixAt:[1,2],how:["Victim shares evidence","Gemini reads screenshots and SMS","Builds a timeline","Fills complaint templates","Tracks deadlines"],tools:[{name:"Gemini 3.8 Flash",does:"Reads screenshots and SMS; writes the complaints"},{name:"Gemini Live",does:"Optional voice intake in Hindi"},{name:"ADK + Cloud Run",does:"The assistant and its steps"},{name:"Firestore",does:"Case files and deadlines"}],data:"Synthetic screenshots and statements; public complaint formats.",build:["Evidence upload and extraction","Timeline builder","Complaint templates","Deadline tracker"],competition:"Medium",difficulty:"Easy",wow:"Medium",similar:"Complaint-drafting bots on Devpost (CaseLens, Lawbiotics).",watchOut:"Paperwork isn't the main bottleneck; courts and payouts are.",verdict:"Best used as the 'money already left' add-on to the scam-hold idea, not on its own."},{id:"mule",track:"bfsi",pick:"Skip",title:"Help small banks trace scam money",problem:"Small cooperative banks don't have the national anti-mule tools, so analysts trace stolen money by hand.",solution:"Map how money hops between accounts and have AI write the investigation report.",story:"An analyst gets a cybercrime complaint. Instead of reading statements one by one, she sees the victim's money hit Account A, split to five accounts in 8 minutes, then to cash. The AI drafts the suspicious-transaction report.",before:["Complaint arrives","Analyst reads statements by hand","Report written manually"],breakAt:[1],after:["Complaint arrives","Money trail mapped automatically","AI drafts the report"],fixAt:[1,2],how:["Load transactions","Find fast money chains","Explain the ring","Draft the report"],tools:[{name:"BigQuery",does:"Transactions"},{name:"Python graph analysis",does:"Money chains (BigQuery Graph now needs a paid plan)"},{name:"Gemini 3.8 Flash",does:"Writes the report"}],data:"IBM AMLSim / SAML-D synthetic laundering data.",build:["Load data","Graph features","Report writer","Review screen"],competition:"High",difficulty:"Medium",wow:"Medium",similar:"Won RBI HaRBInger 2024 and a public-sector bank hackathon in 2026; Google publishes a similar sample.",watchOut:"Looks like Google's own codelab.",verdict:"Skip: crowded."},{id:"health",track:"bfsi",pick:"Skip",title:"Spot padded hospital bills in insurance claims",problem:"Some hospital claims are inflated (extra days, split charges). India loses Rs 8-10k crore a year this way; reviewers check by hand under time pressure.",solution:"AI compares the discharge summary, bill and policy, flags suspicious items with the exact clause, and drafts a polite query letter.",story:"A 58-year-old in Nagpur is hospitalised for dengue for 5 days with a Rs 1.42 lakh bill. The AI notes guidelines suggest 3 days and a lab test billed twice, and writes the query.",before:["Hospital sends the bill","Reviewer checks by hand","Padding slips through or gets disputed"],breakAt:[2],after:["Hospital sends the bill","AI checks against policy and guidelines","Clause-cited query letter"],fixAt:[1,2],how:["Read documents","Compare with policy","Flag items","Draft letter"],tools:[{name:"Gemini 3.8 Flash",does:"Reads long medical documents"},{name:"BigQuery",does:"Hospital billing patterns"}],data:"Synthetic claim packs.",build:["Document reading","Policy rules","Flags","Letter"],competition:"High",difficulty:"Medium",wow:"Low",similar:"Google's own ADK sample does claim adjudication; Vitraya and Medi Assist sell it.",watchOut:"Needs clinically credible data.",verdict:"Skip: crowded and hard to demo."},{id:"msme",track:"bfsi",pick:"Skip",title:"Show small businesses how a bank sees their loan application",problem:"Small business owners get rejected for loans without knowing why; their records are messy.",solution:"AI reads their records, explains how a lender will judge them in plain Hindi, and lists fixes.",story:"Meena runs a tailoring unit in Indore. She uploads bank PDFs and a photo of her ledger. The AI says: 'Your deposits don't match your GST sales by 30%; deposit sales into one account for 3 months.'",before:["Applies with messy records","Rejected","Never told why"],breakAt:[2],after:["Uploads records","AI explains the lender's view","Gets a 90-day fix plan"],fixAt:[1,2],how:["Read records","Apply lender rules","Explain in plain language","Fix plan"],tools:[{name:"Gemini 3.8 Flash",does:"Reads statements and ledger photos"},{name:"Gemini Live",does:"Explains by voice"}],data:"Synthetic statements.",build:["Upload","Rules","Explanation","Plan"],competition:"High",difficulty:"Medium",wow:"Medium",similar:"Won Gen AI Exchange 2024 (Aarthik Setu); several Devpost builds.",watchOut:"Already rewarded at a Google event.",verdict:"Skip: crowded."},{id:"austrac",track:"bfsi",pick:"Skip",title:"Anti-money-laundering paperwork for Australian small firms",problem:"From July 2026, Australian real-estate agents, accountants and lawyers must run anti-money-laundering checks, with no compliance staff.",solution:"AI reads client documents, finds who really controls trusts and companies, screens names and drafts reports.",story:"Sarah, a solo conveyancer in Melbourne, takes a client buying through a family trust. The AI lists who controls the trust, screens them, and flags overseas funds.",before:["New legal duty","No staff or tools","Manual checks"],breakAt:[1],after:["Upload documents","Owners identified and screened","Report drafted"],fixAt:[1,2],how:["Read documents","Find owners","Screen names","Draft report"],tools:[{name:"Gemini 3.8 Flash + Search grounding",does:"Reads documents and screens names"}],data:"Synthetic trust deeds.",build:["Upload","Owner map","Screening","Report"],competition:"High",difficulty:"Medium",wow:"Low",similar:"17+ commercial tools already.",watchOut:"Australia-only story.",verdict:"Skip: crowded and narrow."}],qy=[{id:"kotsu",track:"mfg",pick:"Possible",title:"Capture a veteran worker's know-how before they retire",problem:"Experienced workers know by sound or feel when a machine is set right, but it's never written down. New workers learn by watching for about 5 years, and their mistakes show up later as defects or accidents.",solution:"The expert films a task on a phone. AI finds the moments where they made a judgment call, replays each moment and asks 'what were you checking here?', and turns the answers into a guide in the new worker's language. It then checks the new worker's attempt and turns their mistakes into new questions for the expert.",story:"Sato-san, 63, sets up stamping dies in a 40-person factory in Aichi and retires in March. He knows a die is set right by the sound it makes when he taps it. Nguyen, 24, an intern from Vietnam, has the manual, which doesn't mention the sound. Our AI replays Sato-san's video at 1:42 and asks what he was listening for; his answer and the reference sound go into a Vietnamese guide. When Nguyen skips a step, the AI flags it and asks Sato-san a new question.",before:["Novice watches the expert for years","The manual lists steps, not the 'why'","Expert retires; knowledge leaves","Mistakes show up as defects or accidents"],breakAt:[1,3],after:["Expert films one task on a phone","AI asks about each judgment moment","Guide with clips and sounds, in Vietnamese","Novice's mistakes become new questions; guide v2"],fixAt:[1,2,3],how:["Expert films a task","AI finds judgment moments","Voice interview on each clip","Guide in the novice's language","Check the novice; ask new questions"],tools:[{name:"Gemini 3.8 Flash (video understanding)",does:"Finds the moments where the expert pauses, checks or listens"},{name:"Gemini Live",does:"Interviews the expert by voice while replaying the clip"},{name:"ADK",does:"Runs the steps: find moments, interview, write guide, verify"},{name:"Cloud Storage",does:"Holds the videos and reference sounds"},{name:"BigQuery",does:"Stores each 'cue, decision, reason' rule"},{name:"Cloud Run",does:"Hosts the app"}],data:"Our own phone videos, plus IndustReal and Assembly101 (public assembly videos with labelled mistakes).",build:["Upload a task video; Gemini lists the judgment moments with timestamps","Clip-based voice interview with Gemini Live","Guide builder: steps + clips + sounds + the 'why', translated","Verify mode: a separate checker model reviews the novice's video","Mistakes become new questions; guide v2 shows what changed"],competition:"High",difficulty:"Hard",wow:"High",similar:"Many tools in Japan: Emuni (did a webinar with Google Cloud), Chubu Electric's AI Manual Coach, NTT DATA, tebiki, Augmentir. Only the clip-based interview and the mistake loop are new.",watchOut:"Japanese judges will know the competitors. Live video sessions drop after about 2 minutes, and the AI can 'see' the step it expects, so verification needs a separate checker.",verdict:"Real and moving story, but crowded in Japan. Only pick it if a teammate has factory access and Japanese context.",arch:[{title:"Expert's phone video",sub:"Uploaded to Cloud Storage"},{title:"Gemini video understanding",sub:"Finds judgment moments"},{title:"Gemini Live interview",sub:"Asks about each clip"},{title:"Guide builder",sub:"Rules + clips + sounds, translated"},{title:"Verify with a separate checker",sub:"Reviews the novice's video"},{title:"BigQuery",sub:"Knowledge records; mistakes become new questions"}],demo:[{t:"0:00-0:15",line:"Hook: 'Sato-san retires in March. He knows a die is set right by the sound. Nguyen has the manual, and it doesn't say that.'"},{t:"0:15-0:40",line:"Sato-san films the die change; Gemini marks four judgment moments on the timeline."},{t:"0:40-1:05",line:"The clip at 1:42 replays; the agent asks in Japanese what he was listening for. His answer becomes a rule with the sound attached."},{t:"1:05-1:20",line:"The guide appears in Vietnamese. Nguyen's attempt is checked: step 6 skipped, flagged."},{t:"1:20-1:30",line:"Nguyen's mistake becomes a new question for Sato-san; guide v2 shows the change."}],plan:[{t:"Fri Oct 9",line:"Record 3-4 expert task videos (or use dataset clips); Google Cloud project"},{t:"Sat Oct 10",line:"Gemini finds judgment moments; skeleton deployed"},{t:"Sun Oct 11",line:"Team list locks. Clip-based voice interview with Gemini Live"},{t:"Mon-Tue Oct 12-13",line:"Guide builder and translation (Japanese / Vietnamese)"},{t:"Wed Oct 14",line:"Verify mode with a separate checker; mistakes become questions; guide v2"},{t:"Thu Oct 15",line:"Test on clips with known mistakes; get accuracy numbers"},{t:"Fri Oct 16",line:"Record the video; write the deck and README"},{t:"Sat Oct 17",line:"Submit, then freeze the repo"}]},{id:"phone",track:"mfg",pick:"Skip",title:"Check machine health with just a phone",problem:"Small factories in India have no sensors, so machines run until they break. Sensor systems cost lakhs.",solution:"The operator records 10 seconds of machine sound, photographs the gauge and leaves a voice note. AI compares it with that machine's normal sound and says 'keep running / watch / stop and call the mechanic'.",story:"Ravi's CNC lathe in Rajkot sounds 'off'. He records it; the AI says the sound differs from last week's normal recording, the oil gauge is low, and he should stop before the bearing fails.",before:["Machine sounds odd","Operator guesses","Breakdown and lost days"],breakAt:[1],after:["10-second recording + gauge photo","Compared with the machine's normal sound","Clear 'run / watch / stop' advice"],fixAt:[1,2],how:["Record sound and photo","Compare with baseline","Gemini explains","Advice in Hindi"],tools:[{name:"Gemini 3.8 Flash",does:"Hears the sound, reads the gauge, explains in Hindi"},{name:"Audio embeddings",does:"Compares today's sound with the machine's normal sound"},{name:"BigQuery + Cloud Run",does:"History and the app"}],data:"MIMII and DCASE public machine-sound datasets.",build:["Record","Baseline compare","Explain","History"],competition:"High",difficulty:"Medium",wow:"Medium",similar:"SonicFix and MachMind AI (hackathons), Sensorry (startup).",watchOut:"AI diagnosing from sound alone is unproven.",verdict:"Skip: crowded."},{id:"cbam",track:"mfg",pick:"Skip",title:"Carbon paperwork for small exporters to Europe",problem:"Since 2026 the EU charges a carbon fee on imported steel and aluminium; without real data, buyers use penalised default values. Small Indian forges keep records on paper.",solution:"AI reads photos of electricity bills and furnace logs, calculates emissions per product, and drafts the data pack for the EU buyer.",story:"A 15-person forging unit in Ludhiana gets an email from its German buyer asking for emissions data. The owner photographs 3 months of bills and logs; the AI produces the numbers and the penalty avoided.",before:["Buyer asks for emissions data","Records on paper","Buyer uses penalised defaults or drops the supplier"],breakAt:[2],after:["Photograph bills and logs","Emissions per product calculated","Data pack for the buyer"],fixAt:[1,2],how:["Photos in","Gemini extracts numbers","BigQuery calculates","Pack out"],tools:[{name:"Gemini 3.8 Flash",does:"Reads bills and handwritten logs"},{name:"BigQuery",does:"Emissions calculations"}],data:"Synthetic plant records; EU default values.",build:["Extraction","Calculation","Pack"],competition:"High",difficulty:"Medium",wow:"Low",similar:"Indian products already take handwritten logs and voice notes (CarbonSettle and others).",watchOut:"Overlaps with Sustainability carbon entries.",verdict:"Skip: crowded."},{id:"supply",track:"mfg",pick:"Skip",title:"Warn small suppliers about shortages early",problem:"When export bans or shipping crises hit, small suppliers :["Clean","Link","Ask"],competition:"High",difficulty:"Easy",wow:"Low",similar:"Most maintenance software now has this (UpKeep, MaintainX).",watchOut:"Low visual impact.",verdict:"Skip (could be part of the know-how idea)."},{id:"inspect",track:"mfg",pick:"Skip",title:"Check part quality from a photo",problem:"Small job shops making many different parts can't train a vision model for each one.",solution:"Show the AI one good part and the spec ('burr over 0.5 mm = reject'); it checks phone photos and explains defects.",story:"An inspector photographs a batch of brackets; the AI flags two with burrs and explains why.",before:["Inspection by eye","Defects slip through"],breakAt:[1],after:["Photo + spec","Defects flagged with reasons"],fixAt:[0,1],how:["Golden sample","Spec text","Check photos","Explain"],tools:[{name:"Gemini 3.8 Flash (vision)",does:"Compares photos with the golden sample and spec"}],data:"MVTec AD 2 / VisA public defect images.",build:["Upload","Check","Explain"],competition:"High",difficulty:"Easy",wow:"Low",similar:"Google showcases this with Hitachi; hackathon winners already did it.",watchOut:"Most overused datasets.",verdict:"Skip."},{id:"voice",track:"mfg",pick:"Skip",title:"Hands-free help when a production line stops",problem:"When a machine stops, workers dig through manuals.",solution:"A voice assistant that answers from the manuals and logs the issue.",story:"A line stops; the operator asks out loud what error E42 means and gets the fix steps.",before:["Line stops","Search manuals"],breakAt:[1],after:["Ask by voice","Get steps; issue logged"],fixAt:[0,1],how:["Ask","Search manuals","Answer","Log"],tools:[{name:"Gemini Live + Vertex AI Search",does:"Voice answers from manuals"}],data:"Equipment manuals.",build:["Manuals index","Voice","Log"],competition:"High",difficulty:"Easy",wow:"Low",similar:"Google publishes this as a reference sample; many Gemini Live entries, none placed.",watchOut:"Judges have seen it.",verdict:"Skip."}],Yy=[{id:"crop",track:"sus",pick:"Strong backup",title:"Help farmers win crop-insurance claims",problem:"After a flood or hailstorm, a farmer has 72 hours to report the loss, then waits for a surveyor who often comes weeks late or never. Without proof, claims get disputed: Rs 5,927 crore of claims are pending.",solution:"The farmer sends a voice note and photos. AI files the report on time, pulls satellite images proving the field was flooded, tracks every deadline and drafts escalation letters.",story:"Sabitri's paddy field in Jajpur, Odisha, has been underwater since 15 August. The helpline is busy. She sends a voice note in Odia. The AI fills her report, shows satellite images with water over her field for 6 days, and when no surveyor is appointed by day 3, sends an escalation letter.",before:["Helpline busy; app upload fails","Surveyor comes weeks late; damage is gone","Claim disputed; farmer has no proof","Gets Rs 6, or nothing"],breakAt:[0,1,2],after:["Voice note and photos, in Odia","Report filed within 72 hours","Satellite proof of flooding attached","Deadline alerts and escalation letters"],fixAt:[1,2,3],how:["Farmer reports by voice","AI finds the field on the map","Pulls satellite images and rainfall","Writes report and evidence pack","Watches deadlines and escalates"],tools:[{name:"Gemini Live",does:"Takes the farmer's report by voice in Odia or Hindi"},{name:"Gemini 3.8 Flash",does:"Reads the policy receipt; writes the report and evidence pack"},{name:"Earth Engine",does:"Satellite images: Sentinel-1 radar sees water through clouds; Sentinel-2 shows crop damage"},{name:"Google field boundaries (ALU API)",does:"Finds the outline of the farmer's field"},{name:"BigQuery",does:"Claims, deadlines and village totals"},{name:"ADK + Cloud Run",does:"The agent and the app"}],data:"Sentinel-1 and Sentinel-2 images, CHIRPS rainfall, the PMFBY rule book; the real Odisha floods of August 2026.",build:["Earth Engine script: flood map for one field before and after the event","Voice intake: report from a voice note, policy receipt read automatically","Evidence pack PDF: radar, crop health, rainfall, photo location check","Deadline tracker with escalation letters","Village dashboard: share of insured area reporting (25% changes how claims are settled)"],competition:"Low",difficulty:"Hard",wow:"High",similar:"A US version placed 2nd at a hackathon (CropMIND AI). Government apps only collect reports; nothing builds the farmer's evidence.",watchOut:"Register for Earth Engine today. Satellite pixels are 10 m, so it proves flooding, not the exact loss. Filing is simulated (no public portal). Rishabh's earlier prototype can't be reused as code.",verdict:"Best social-impact option and a great story, but riskier to finish in 8 days because of satellite work and data access.",arch:[{title:"Farmer's voice note + photos",sub:"Simple web / WhatsApp-style app"},{title:"Agent on Cloud Run",sub:"ADK + Gemini reads receipt, finds field"},{title:"Earth Engine",sub:"Radar flood map, crop health, rainfall"},{title:"Gemini 3.8 Flash",sub:"Writes the report and evidence pack"},{title:"BigQuery",sub:"Claims and deadlines"},{title:"Escalations + village dashboard",sub:"Letters on missed deadlines"}],demo:[{t:"0:00-0:15",line:"Hook: 'Sabitri's paddy has been underwater since 15 August. She has 72 hours to report. The helpline is busy.'"},{t:"0:15-0:35",line:"She sends an Odia voice note; the AI reads her policy receipt, outlines her field and starts the countdown."},{t:"0:35-1:00",line:"Satellite radar before and after: water over her field for 6+ days; rainfall spike; her photo verified on the plot."},{t:"1:00-1:15",line:"The pre-filled report goes out and the evidence pack PDF is saved."},{t:"1:15-1:30",line:"Day 3, no surveyor: an escalation letter goes out. 'Evidence that used to wash away now stays.'"}],plan:[{t:"Fri Oct 9",line:"Register Earth Engine and Google Cloud; check Odisha's 2026 insurance notice; pick test fields in Jajpur"},{t:"Sat Oct 10",line:"Earth Engine flood map for one field; skeleton deployed"},{t:"Sun Oct 11",line:"Team list locks. Voice intake, receipt reading, field location"},{t:"Mon-Tue Oct 12-13",line:"Evidence pack PDF and report writing"},{t:"Wed Oct 14",line:"Deadline tracker, escalation letters, village dashboard"},{t:"Thu Oct 15",line:"Test on 20 flooded and dry fields; accuracy numbers"},{t:"Fri Oct 16",line:"Record the video; write the deck and README"},{t:"Sat Oct 17",line:"Submit, then freeze the repo"}]},{id:"alert",track:"sus",pick:"Possible",title:"Make disaster alerts two-way",problem:"India sends billions of disaster SMS alerts, but they are generic, one-way, and nobody knows who actually got to safety.",solution:"AI turns an official alert into household-specific instructions, calls people in their dialect, collects 'safe / need help', and shows officials who hasn't answered, starting with the elderly and disabled.",story:"A cyclone warning hits coastal Odisha. Lakshmi, 70, lives alone in a mud house. She gets a call in Odia: 'Go to the school shelter on the hill by 6 pm; take your medicines.' She presses 1. Her neighbour doesn't answer; the village volunteer's list shows him at the top.",before:["Generic SMS to everyone","Wrong language, sometimes delayed","No idea who is safe"],breakAt:[2],after:["Instructions for each household","Voice call in dialect","'Safe / need help' collected; list of who hasn't answered"],fixAt:[0,1,2],how:["Official alert in","Rewrite per household","Call in dialect","Collect replies","Volunteer list"],tools:[{name:"Gemini 3.8 Flash",does:"Rewrites the alert for each household"},{name:"Gemini Live / Text-to-Speech",does:"Voice calls in dialect"},{name:"Pub/Sub",does:"Receives the official alert feed"},{name:"BigQuery + Google Maps / Open Buildings",does:"Households and replies on a map"},{name:"Cloud Run",does:"The app"}],data:"GDACS and Indian alert feeds; Open Buildings; synthetic households.",build:["Alert feed","Household rewrite","Calls","Replies dashboard"],competition:"Low",difficulty:"Medium",wow:"Medium",similar:"Japan already has it (NTT East). In India, alerts are one-way.",watchOut:"Real calls need a phone provider; simulate in the demo.",verdict:"Possible backup with a clear 'last mile' story."},{id:"heat",track:"sus",pick:"Possible",title:"Check on outdoor workers during dangerous heat",problem:"Heat alerts go to whole districts, but workers keep working outdoors and people die alone at home. In Tokyo, 121 of 181 indoor heat deaths had the air conditioner off.",solution:"When the heat at someone's location gets dangerous, an AI calls them in their language, checks they're okay and resting, and alerts a supervisor or family if they don't answer.",story:"Suresh, a construction worker in Mumbai, gets a call at 1 pm on a hot, humid day: 'The heat is dangerous now. Rest in shade for 15 minutes and drink water. Press 1 if you're okay.' No answer twice, so his site supervisor is alerted.",before:["District-wide alert","Work continues in peak heat","Nobody checks on him"],breakAt:[1,2],after:["Heat risk at his site","Voice check-in call","Supervisor alerted if no answer"],fixAt:[0,1,2],how:["Heat + humidity risk","Trigger a call","Check-in","Escalate if silent"],tools:[{name:"Gemini Live",does:"Check-in calls in Hindi or Marathi"},{name:"Weather data (WeatherNext / Open-Meteo)",does:"Heat-plus-humidity risk by location"},{name:"Pub/Sub + BigQuery + Cloud Run",does:"Triggers, logs and the app"}],data:"Historical weather for a past heatwave (replay).",build:["Heat risk","Calls","Escalation","Log"],competition:"Medium",difficulty:"Medium",wow:"Medium",similar:"Crowded for elderly people in Japan (NTT East and others); open for Indian outdoor workers.",watchOut:"Heat season is over, so the demo is a replay.",verdict:"Possible, if focused on Indian outdoor workers."},{id:"triage",track:"sus",pick:"Possible",title:"Find who needs help after a flood",problem:"After a typhoon, help requests pour in as voice notes and photos; responders read them by hand, and the worst-hit areas often send nothing.",solution:"AI turns messages into a map of needs and uses satellite flood maps to highlight flooded villages that sent no messages (a 'silence map').",story:"After a typhoon in the Philippines, thousands of messages arrive in Tagalog. The AI maps water, food and medical needs, and shows that one flooded village with 400 houses sent zero messages, so a team goes there first.",before:["Messages pour in","Read by hand","Silent areas missed"],breakAt:[1,2],after:["Messages mapped automatically","Needs ranked","Silent flooded areas highlighted"],fixAt:[0,1,2],how:["Messages in","Gemini extracts needs","Flood map overlay","Silence map"],tools:[{name:"Gemini 3.8 Flash",does:"Understands voice notes, photos and text in Tagalog"},{name:"Earth Engine + Open Buildings",does:"Flood extent and houses"},{name:"BigQuery + Cloud Run",does:"Data and map app"}],data:"Past typhoon data (Kalmaegi 2025), Google Groundsource flood events.",build:["Message parsing","Flood overlay","Silence map"],competition:"Medium",difficulty:"Hard",wow:"High",similar:"A Gemini 3 Hackathon runner-up (Aegis) already did message triage; only the silence map is new.",watchOut:"Easy to mistake for a disaster dashboard.",verdict:"Possible, but the core was done before."},{id:"entitle",track:"sus",pick:"Skip",title:"Fix the paperwork that blocks welfare payments",problem:"People get rejected for government schemes because names don't match across documents ('Anita' vs 'Aneeta') or Aadhaar isn't linked to their bank.",solution:"AI reads photos of their documents, spots mismatches and tells them exactly which office and form fixes each one.",story:"Anita's maternity benefit is stuck. The AI spots her bank passbook says 'Aneeta' and tells her which form to submit at the bank.",before:["Applies","Payment rejected","Doesn't know why"],breakAt:[1,2],after:["Photos of documents","Mismatch found","Exact fix steps"],fixAt:[1,2],how:["Read documents","Compare names","Fix plan"],tools:[{name:"Gemini 3.8 Flash (vision)",does:"Reads and compares documents"}],data:"Synthetic documents only (privacy).",build:["Upload","Compare","Plan"],competition:"High",difficulty:"Easy",wow:"Low",similar:"The most-built Indian hackathon idea; Adhikaar won 'Best Use of Gemini' in May 2026.",watchOut:"Privacy of ID documents.",verdict:"Skip: crowded."},{id:"irrig",track:"sus",pick:"Skip",title:"Tell farmers when to water and when to skip",problem:"Farmers irrigate by habit while groundwater is stressed in about a quarter of India's areas.",solution:"A weekly voice message: 'Skip watering this week; rain is coming and your area's groundwater is critical.'",story:"Two farmers in a stressed block get different advice based on crop stage and rain forecast.",before:["Water by habit","Groundwater drops"],breakAt:[0],after:["Weekly voice advice","Water saved"],fixAt:[0,1],how:["Crop stage","Rain forecast","Groundwater status","Voice advice"],tools:[{name:"Earth Engine + Gemini",does:"Crop water need and advice"}],data:"ERA5-Land, CHIRPS, groundwater reports.",build:["Model","Advice","Voice"],competition:"Medium",difficulty:"Medium",wow:"Low",similar:"Pieces exist separately (NASA Space Apps winners).",watchOut:"Hard to show impact in 3 minutes.",verdict:"Skip."},{id:"waste",track:"sus",pick:"Skip",title:"Prove recycled plastic was really collected",problem:"Companies buy recycling certificates, but lakhs of certificates turned out fake, and the waste pickers who do the work aren't recorded.",solution:"AI checks photos and weighbridge slips at collection points to prove material was collected, and flags certificates that exceed what was collected.",story:"A waste-picker cooperative logs each handover with a photo; the AI estimates the plastic and flags a recycler claiming 3x what it received.",before:["Certificates traded","No proof of collection"],breakAt:[1],after:["Photo proof at handover","Over-claims flagged"],fixAt:[0,1],how:["Photo + slip","Estimate","Match certificates"],tools:[{name:"Gemini 3.8 Flash (vision) + BigQuery",does:"Estimates material and matches claims"}],data:"Synthetic collection logs.",build:["Capture","Estimate","Match"],competition:"High",difficulty:"Medium",wow:"Low",similar:"QR and blockchain versions everywhere.",watchOut:"Crowded.",verdict:"Skip."}],Ly=[{id:"spotted",track:"retail",pick:"Strong backup",title:"Find that thing you saw: describe it in plain words, the agent finds it",problem:"You see something you like out in the world: a colleague's shirt, an actor's watch in a movie, shoes on someone at the mall. You can't take a photo, and later you don't know what it's called ('band collar', 'chukka boots', 'field watch'), so normal search shows thousands of random results and you give up.",solution:"Tell the agent what you remember, in plain words or Hinglish, by voice or text. It asks a few smart questions, shows quick pictures to check ('closer to this one or this one?') and narrows it down until you say 'yes, that's it'. Then it finds real products you can buy, ranked by your taste, budget and delivery date. It works for anything: shirts, jeans, shoes, watches, bags, sunglasses, even a lamp.",story:"Arjun, 29, sees a colleague wearing a watch he loves: small round face, green dial, thin steel strap. He has no photo and no idea what it's called. On the way home he tells the agent: 'office mein ek banda green dial wali chhoti si watch pehne tha, steel strap, simple sa'. The agent asks two questions (numbers or lines on the dial? silver or gold case?) and shows four quick pictures. Arjun taps one: 'yes, like this, but thinner'. The agent works out it is a 'field watch with a sunburst green dial, about 38 mm', finds five real ones under Rs 8,000 that arrive by Friday, and puts the one closest to his usual style first.",before:["Sees a watch he likes; can't take a photo","Searches 'green watch' and gets thousands of random results","Doesn't know the right words ('field watch', '38 mm', 'sunburst dial')","Gives up, or buys something that isn't quite it"],breakAt:[1,2],after:["Describes it from memory, in Hinglish, by voice","Agent asks 2-3 smart questions and shows quick pictures to compare","'Yes, that's it': the agent turns it into the right product words","Real options in his budget, arriving by Friday, his style first"],fixAt:[1,2,3],how:["Describe what you saw","Agent asks smart questions","Pick the closest picture ('more like this')","Agent searches real stores","Options in your budget, taste and delivery date"],tools:[{name:"Gemini Live",does:"Listens to the description in Hindi, English or Hinglish and asks follow-up questions by voice"},{name:"Gemini 3.8 Flash",does:"Turns a vague memory into precise product words and picks the most useful next question"},{name:"Gemini image generation (Nano Banana)",does:"Draws quick pictures of what you described, so you can say 'closer to this one'"},{name:"Gemini Embedding 2 + Firestore vector search",does:"Matches the chosen picture to real products that look alike"},{name:"Google Search grounding",does:"For 'the shirt Ranbir wore in that song': finds out what the item actually was"},{name:"ADK (Agent Development Kit)",does:"The agent and its loop: question, picture, search"},{name:"Cloud Run + Firebase Hosting",does:"Hosts the agent and the phone-friendly app"},{name:"Partner stores (Google's UCP, Shopify catalog) + courier delivery API",does:"Real products, delivery dates to your pincode and checkout handoff (simulated in the demo)"}],data:"A product catalogue across categories (for example Kaggle 'Fashion Product Images', about 44,000 Myntra items including watches, shoes and bags) with prices, stock and simulated delivery; plus 50 'memory' tests: the team writes descriptions of real things they saw and we check whether the agent finds them.",build:["Memory chat: voice or text in; Gemini lists what it knows (colour, shape, material, category) and what's missing","Smart questions: ask the 2-3 questions that best split the possibilities","Picture check: generate 4 quick images; the shopper taps the closest and says what to change; repeat once or twice","Find real products: use the chosen picture and words to search the catalogue, with filters for budget and delivery date","Personal ranking: put the shopper's own style first, learned from what they liked before (and, optionally, wardrobe photos)","Add-ons: the right size per brand; a 'Spotted' list to save a 10-second voice note in the moment and search later","Proof: run the 50 memory tests; report how often the right kind of item is in the top 5, and how many questions it took"],competition:"High",difficulty:"Medium",wow:"High",similar:"Google AI Mode lets you describe what you want and shop it (also in India), and Google's US-only 'vision match' draws a garment you describe and shows similar products. Daydream (US, US$50M raised), Cressi and Tonita do chat-based shopping in the US. Amazon Lens, Remode and Daydream also work from a photo; Amazon's 'Shop the Scene' for Prime Video is US-only.",watchOut:"Judges are Google staff and know AI Mode, so the demo must show what it can't: no photo, a vague memory in Hinglish, the 'which is closer?' picture loop, a non-clothing item like a watch, and Indian stores with delivery dates. Generated pictures must look like real products, not fantasy. Store data is simulated in the demo.",verdict:"A very relatable idea with a great demo that uses a lot of Gemini (voice, image generation, search, embeddings). The general 'describe it and shop' space is crowded, so we win on the memory-first picture loop, any category, Hinglish voice, movie and cricket-star lookups, and Indian stores with delivery dates. Still just below the BFSI pick, but if the team is more excited about shopping, build this.",arch:[{title:"Phone app (Firebase)",sub:"Voice or text: what you remember"},{title:"Gemini Live + 3.8 Flash",sub:"Understands the memory, asks smart questions"},{title:"Gemini image generation",sub:"Draws quick pictures to compare"},{title:"Agent on Cloud Run (ADK)",sub:"Runs the loop: question, picture, search"},{title:"Product match",sub:"Gemini Embedding 2 + Firestore vectors over partner catalogues"},{title:"Your taste + delivery",sub:"Ranks by style, budget and date; checkout on the store"}],demo:[{t:"0:00-0:15",line:"Hook: 'You saw it on someone. No photo. You don't even know what it's called. Search fails.'"},{t:"0:15-0:40",line:"Arjun describes the watch in Hinglish by voice; the agent asks two quick questions."},{t:"0:40-1:00",line:"Four generated pictures; he taps one and says 'thinner'; second round; 'yes, that's it'."},{t:"1:00-1:20",line:"Five real watches under Rs 8,000 that arrive by Friday, his style first; one tap to the store."},{t:"1:20-1:30",line:"A quick second example: 'the white shirt Ranbir wore in that song' is found through web search, then lookalikes. Close with our numbers from the 50 memory tests."}],plan:[{t:"Sat Oct 10",line:"Decide; Google Cloud project; build the catalogue (clothes, shoes, watches, bags) with prices and delivery; write the 50 memory tests"},{t:"Sun Oct 11",line:"Team list locks. Memory chat with Gemini (text first): pull out colour, shape, material, category"},{t:"Mon Oct 12",line:"Smart questions and the picture check with Gemini image generation"},{t:"Tue Oct 13",line:"Product match: embeddings plus filters for budget and delivery date"},{t:"Wed Oct 14",line:"Voice with Gemini Live (Hindi / Hinglish); personal ranking; movie and celebrity lookup with Search grounding"},{t:"Thu Oct 15",line:"Deploy; run the 50 memory tests; fix the misses"},{t:"Fri Oct 16",line:"Polish; record the video; write the deck and README"},{t:"Sat Oct 17",line:"Submit, then freeze the repo"}]},{id:"fit",track:"retail",pick:"Possible",title:"Add-on: the right size in every brand, learned from your wardrobe",problem:"In India, 25-40% of clothes bought online get returned, and about half of those returns are because of size. Every brand sizes differently (India has no standard size chart yet), so people guess, order two sizes, or give up. Shopping assistants suggest what looks good, not what will fit, and they don't know what you already own.",solution:"You photograph clothes you already own and love, plus their size labels. The agent learns your taste and your real size in each brand. When you see something you like, you share a screenshot with your budget and date. It finds lookalikes, picks the right size per brand, checks delivery to your pincode, skips things you already own, and shows what it goes with in your wardrobe.",story:"Priya, 27, in Bengaluru, photographs 15 of her favourite clothes and the labels of three kurtas that fit perfectly. The agent learns she loves white and pastels, thin stripes and A-line cuts, and that she is an M in one brand but an L in another. She sees a blue striped kurta on Instagram and sends the screenshot: 'like this, but white with thin stripes, under Rs 1,500, by Saturday for my cousin's mehendi.' The agent shows three options and says 'take L in this brand; its M is 2 inches tighter than the kurtas you kept'. It drops one that would arrive on Monday, and notes that her mint dupatta goes with option 2.",before:["Sees a kurta she likes on Instagram","Guesses her size; orders M and L to be safe","One arrives late, one doesn't fit","Each return costs the brand Rs 120-280"],breakAt:[1,2],after:["Shares the screenshot, budget and date","Agent picks the right size in each brand from clothes she kept","Only shows items that arrive before Saturday","She orders once; it suggests what goes with it from her wardrobe"],fixAt:[1,2,3],how:["Photograph your wardrobe and size labels","AI builds your taste and fit profile","Share what you like, budget and date","Agent searches partner stores, checks size and delivery","You approve; checkout happens on the store"],tools:[{name:"Gemini 3.8 Flash",does:"Reads clothes (colour, stripes, neckline, sleeve) and size labels from photos"},{name:"Gemini Embedding 2",does:"Turns photos into numbers so we can find lookalikes"},{name:"Firestore vector search",does:"Finds the closest-looking items in the catalogue"},{name:"ADK (Agent Development Kit)",does:"The shopping agent and its steps: search, filter, explain"},{name:"Gemini Live",does:"Lets the shopper ask by voice ('white, thin stripes, by Saturday')"},{name:"Cloud Run + Firebase Hosting",does:"Hosts the agent and the phone-friendly app"},{name:"Cloud Storage",does:"Holds wardrobe and label photos (deleted after use)"},{name:"Universal Commerce Protocol (UCP)",does:"Google's open standard for agents to talk to stores; Google provides a sample store we can run as our 'partner brand'"},{name:"Courier delivery-date API (Shiprocket / ClickPost)",does:"Delivery estimate from the brand's warehouse to your pincode (simulated in the demo)"}],data:"Kaggle 'Fashion Product Images' (about 44,000 Myntra items with photos and attributes; we add prices, sizes and stock), real size charts from 4-6 brands, our own wardrobe and label photos, and the public RentTheRunway / ModCloth fit-feedback data to test size predictions.",build:["Wardrobe: photo in, attributes out; label photo in, brand and size out, with a 'confirm what I read' step","Fit passport: measure 2-3 well-fitting items laid flat next to a credit card for scale, compare with each brand's chart, and show the size per brand with a confidence level","Lookalikes: screenshot to attributes and embeddings, then filters for price, size in stock and delivery date; Gemini explains each pick","Wardrobe check: skip near-duplicates and suggest pairings with clothes she owns","Store connection: a mock partner store speaking Google's UCP, delivery from a courier API or pincode table, checkout handed to the store with her approval","Proof: label reading on 30 real labels, lookalike accuracy on 50 screenshots, size accuracy on RentTheRunway data vs 'buy your usual size'"],competition:"Medium",difficulty:"Medium",wow:"High",similar:"Wardrobe stylists are everywhere (15+ Gemini hackathon projects, none won). In India: Tulam (closet plus screenshot matching, no fit), StyleAi (not launched; sizes from one size you type in), ZipRIGHT (needs a body scan), Myntra's size engine (Myntra only). Google Personal Intelligence, now live in India, knows what you bought, not what fits you.",watchOut:"Lead with fit and returns, never with 'AI stylist'. Photo measurements can be off by 2-3 cm if clothes are creased, so use a guided flat photo and show confidence. The catalogue, delivery and checkout are simulated in the demo.",verdict:"Best as an add-on to the 'find that thing you saw' agent: once it finds the item, it also tells you which size to order in that brand. On its own it is a narrower idea, and Indian startups (StyleAi, ZipRIGHT) are heading the same way."},{id:"general",track:"retail",pick:"Skip",title:"A general AI shopping assistant (photo, budget, suggestions)",problem:"Finding something you saw, at your budget, across many apps takes time.",solution:"Share a photo and your budget; the agent suggests similar products.",story:"Rahul shares a photo of sneakers and asks for similar ones under Rs 4,000.",before:["Searches several apps","Scrolls endless results"],breakAt:[1],after:["Shares a photo and budget","Gets a shortlist"],fixAt:[1],how:["Photo in","Find similar","Filter by budget","Suggest"],tools:[{name:"Gemini 3.8 Flash + a product search",does:"Understands the photo and finds similar items"}],data:"A public product catalogue.",build:["Photo search","Filters","Suggestions"],competition:"High",difficulty:"Easy",wow:"Medium",similar:"Google AI Mode and Personal Intelligence (live in India), Amazon's Alexa for Shopping (used by over 1 crore Indians) and Amazon Lens, Myntra Maya, Flipkart SLAP, Zamana.",watchOut:"Judges are Google staff, and this is close to Google's own product.",verdict:"Skip: the plain version is what Google AI Mode already does. Only the memory-first version at the top stands out."},{id:"stylist",track:"retail",pick:"Skip",title:"An AI stylist that plans outfits from your own wardrobe",problem:"People own lots of clothes but wear the same few, and buy things that don't go with anything.",solution:"Photograph your wardrobe; the AI suggests outfits for occasions and weather.",story:"Anjali photographs her wardrobe and asks what to wear to an office party.",before:["Same outfits every week","Impulse buys that don't match"],breakAt:[0,1],after:["Wardrobe digitised","Outfit ideas from what she owns"],fixAt:[0,1],how:["Photograph clothes","Tag them","Suggest outfits"],tools:[{name:"Gemini 3.8 Flash",does:"Tags clothes and suggests outfits"}],data:"Own wardrobe photos.",build:["Wardrobe","Tags","Outfits"],competition:"High",difficulty:"Easy",wow:"Medium",similar:"15+ Gemini hackathon projects (none won a top prize), Acloset (8 million users), and Indian apps Tulam, Styra\xE9 and Outfii.",watchOut:"Judges have seen many of these.",verdict:"Skip as the headline. Use the wardrobe as a supporting feature inside the fit-first agent (taste, duplicates, pairings)."},{id:"tryon",track:"retail",pick:"Skip",title:"Virtual try-on: see clothes on yourself",problem:"Shoppers can't tell how clothes will look on them.",solution:"Upload a photo of yourself and see the outfit on you.",story:"Sneha uploads a photo and sees how a saree would look on her.",before:["Guesses how it will look"],breakAt:[0],after:["Sees it on herself"],fixAt:[0],how:["Photo of you","Photo of the clothes","Generated try-on"],tools:[{name:"Virtual Try-On on Agent Platform",does:"Generates the try-on image"}],data:"Product photos and selfies.",build:["Upload","Generate","Show"],competition:"High",difficulty:"Easy",wow:"Medium",similar:"Google's try-on in Search and Shopping, many hackathon projects. Google shut down its own Doppl try-on app in April 2026.",watchOut:"Try-on shows how it looks, not whether it fits; Google's try-on m
