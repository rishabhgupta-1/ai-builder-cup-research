r Aadhaar is linked to money laundering and she is under 'digital arrest'. He tells her to move Rs 18 lakh to an 'RBI account' and, if the bank asks, to say it's for her son's flat. Today the bank's pop-up asks 'Are you sure?' and she taps Yes. With our agent, a calm voice asks which builder, offers to call her son, and hears a man's voice in the background. The money stays on hold and her son is alerted.",before:["Scammer coaches her on a video call","Bank flags the Rs 18 lakh transfer","Pop-up says 'Are you sure?'; she taps Yes","Money vanishes through mule accounts in minutes"],breakAt:[2],after:["Bank flags and holds the transfer","AI agent talks to her in Marathi","Spots coaching: vague answers, 'don't tell my son', a second voice","Keeps the hold, alerts her son and the fraud team, saves the evidence"],fixAt:[1,2,3],how:["Bank holds a risky payment","Agent starts a voice check in her language","Checks her answers against bank data","A clear rulebook decides","Analyst approves; evidence saved"],tools:[{name:"Gemini Live (gemini-3.8-live)",does:"The AI voice that listens and talks in real time, in Hindi, Marathi, Tamil, Japanese, Korean and more"},{name:"Gemini 3.8 Flash",does:"Reads the conversation and explains which warning signs it heard"},{name:"ADK (Agent Development Kit)",does:"Google's framework for building the agent and its steps"},{name:"Cloud Run",does:"Hosts our app and the live voice connection"},{name:"Pub/Sub",does:"Passes 'payment held' events from the bank system to our agent"},{name:"BigQuery",does:"Stores evidence records and our library of scam scripts"},{name:"Firestore",does:"App data: customers, holds, decisions"},{name:"Model Armor",does:"Blocks attempts to trick the AI with injected instructions"}],data:"All synthetic, so nothing can block us: fake transactions (PaySim / IBM AMLSim) with scam patterns added, and about 200 scripted conversations (coached vs genuine) written from real news cases.",build:["Bank console: a list of held payments with their warning signs (a mock risk engine)","Voice agent: a Gemini Live session with our scam playbook as its instructions","Decision: a points table turns the answers into release / keep hold / call family / call police","Evidence: one-click PDF with the transcript, reasons and timestamps","Proof: run 200 test conversations and report how many coached cases we catch compared with a pop-up"],competition:"Medium",difficulty:"Medium",wow:"High",similar:"Westpac SaferPay (Australia, tap-based questions in English), Starling (UK, built on Gemini, the customer has to start it), and 'Second Voice' (a UK hackathon entry). None in Indian or Asian languages, none for bank branches, none mapped to RBI's new rules.",watchOut:"Test voice quality in Marathi and Hindi on day 1. Don't claim it saves everyone: its job is to catch coaching and escalate early with evidence.",verdict:"Clearest problem, best demo, and new rules in India (from Jan 2027), Korea and Australia push banks to do exactly this. Everything runs on synthetic data, so no outside approval can hold us up.",arch:[{title:"Bank risk system (mock)",sub:"Flags and holds a payment"},{title:"Pub/Sub",sub:"Sends the 'payment held' event"},{title:"Voice agent on Cloud Run",sub:"ADK + Gemini Live talks to the customer"},{title:"Gemini 3.8 Flash",sub:"Scores warning signs against the scam playbook"},{title:"Rules + analyst console",sub:"Decision with one-click approval"},{title:"BigQuery + PDF",sub:"Evidence record for the bank"}],demo:[{t:"0:00-0:15",line:"A staged clip: the fake officer coaching Shalini on a video call."},{t:"0:15-0:25",line:"Today: the pop-up, she taps Yes, the money splits across accounts. Caption: 'Rs 3 crore left one mule account in 29 minutes'."},{t:"0:25-0:35",line:"Rewind. Our bank console shows the warning signs and holds the payment."},{t:"0:35-1:15",line:"The agent speaks Marathi (English subtitles): purpose, builder, 'may I call Rohan?', 'is anyone on a call with you?'. A second voice is heard; the risk meter climbs."},{t:"1:15-1:30",line:"Recommendation: keep the hold 24 hours, call her son, pre-filled police referral. The analyst approves with one click; the evidence PDF appears."}],plan:[{t:"Fri Oct 9",line:"Pick the idea; Google Cloud project and billing; test Gemini Live in Hindi and Marathi; create the repo"},{t:"Sat Oct 10",line:"Skeleton deployed on Cloud Run; mock bank console with held payments; write the scam playbook"},{t:"Sun Oct 11",line:"Team list locks. Voice agent v1 (English + Hindi) answering on a held payment"},{t:"Mon-Tue Oct 12-13",line:"Rules table and analyst approval; coaching signals; evidence PDF"},{t:"Wed Oct 14",line:"Marathi and a Singapore version; recovery pack if time allows"},{t:"Thu Oct 15",line:"Run 200 test conversations; fix failures; get the numbers for the deck"},{t:"Fri Oct 16",line:"Record the 3-minute video; write the deck and README"},{t:"Sat Oct 17",line:"Submit, then freeze the repo"}]},{id:"vkyc",track:"bfsi",pick:"Strong backup",title:"Catch fake account openings in video-KYC calls",problem:"Scam gangs open 'mule' bank accounts by coaching people through the bank's video-KYC call. Banks check only a sample of recordings by hand. Investigators found 8.5 lakh mule accounts across 700+ branches.",solution:"AI reviews every recorded KYC call, flags coaching (someone prompting off-camera, scripted answers), and links calls that share the same room, voice or device across 'different' people.",story:"Three 'different' people open accounts on three different days. Each one passes the live checks. Our AI notices the same poster on the wall behind all three and the same off-camera voice whispering answers, and flags them together as a likely mule factory.",before:["Applicant joins the video-KYC call","Agent checks face and documents","A few recordings are audited by hand weeks later","Coached mule accounts go live and receive scam money"],breakAt:[2,3],after:["Every recording is reviewed by AI","Checklist checked with timestamps","Coaching signs flagged","Same room / voice / device linked across applicants"],fixAt:[1,2,3],how:["KYC recording uploaded","Gemini watches and checks the RBI checklist","Looks for prompting and scripted answers","Matches rooms and voices across sessions","Auditor reviews the flagged cases"],tools:[{name:"Gemini 3.8 Flash (video understanding)",does:"Watches the recording and checks each rule with timestamps"},{name:"BigQuery vector search",does:"Finds sessions with similar rooms, voices or devices"},{name:"Cloud Storage",does:"Holds the recordings"},{name:"Cloud Run + Firestore",does:"Auditor dashboard and case data"}],data:"No public KYC videos exist, so we would record about 20 scripted sessions ourselves (some coached).",build:["Record scripted sessions","Checklist review with timestamps","Coaching detector (second voice, off-screen reading)","Cross-session matching","Auditor dashboard"],competition:"Low",difficulty:"Hard",wow:"Medium",similar:"Deepfake detectors exist (HyperVerge, IDfy). An auditor for coaching and cross-applicant linking doesn't.",watchOut:"Needs our own videos; less emotional demo than the scam-hold idea. Don't sell it as a deepfake detector.",verdict:"Open space with a clear rule behind it (RBI: any prompting during video-KYC means rejection). Good backup if the team prefers it."},{id:"recover",track:"bfsi",pick:"Possible",title:"Help scam victims get their money back",problem:"After a scam, victims must report fast to several places with scattered evidence. In India only about 0.3% of reported losses come back.",solution:"An AI assistant on WhatsApp turns screenshots, bank SMS and a voice note into a ready-to-file complaint pack within the first hour.",story:"Imran, 41, in Lucknow sent Rs 2.6 lakh by UPI to a fake 'courier customs' caller 25 minutes ago. He forwards his bank SMS and chat screenshots and speaks in Hindi. In 10 minutes he has a 1930 call script, a pre-filled cybercrime complaint with the transaction IDs, and a letter for his bank.",before:["Calls 1930: busy, 2-3 tries","Fills separate forms for bank, portal and police","Missing transaction IDs delay freezing the scammer's account","Waits months; almost nothing returns"],breakAt:[1,2],after:["Sends screenshots and a voice note","AI pulls out transaction IDs, amounts, accounts","Gets a pre-filled complaint, call script and bank letter","Deadline reminders"],fixAt:[1,2],how:["Victim shares evidence","Gemini reads screenshots and SMS","Builds a timeline","Fills complaint templates","Tracks deadlines"],tools:[{name:"Gemini 3.8 Flash",does:"Reads screenshots and SMS; writes the complaints"},{name:"Gemini Live",does:"Optional voice intake in Hindi"},{name:"ADK + Cloud Run",does:"The assistant and its steps"},{name:"Firestore",does:"Case files and deadlines"}],data:"Synthetic screenshots and statements; public complaint formats.",build:["Evidence upload and extraction","Timeline builder","Complaint templates","Deadline tracker"],competition:"Medium",difficulty:"Easy",wow:"Medium",similar:"Complaint-drafting bots on Devpost (CaseLens, Lawbiotics).",watchOut:"Paperwork isn't the main bottleneck; courts and payouts are.",verdict:"Best used as the 'money already left' add-on to the scam-hold idea, not on its own."},{id:"mule",track:"bfsi",pick:"Skip",title:"Help small banks trace scam money",problem:"Small cooperative banks don't have the national anti-mule tools, so analysts trace stolen money by hand.",solution:"Map how money hops between accounts and have AI write the investigation report.",story:"An analyst gets a cybercrime complaint. Instead of reading statements one by one, she sees the victim's money hit Account A, split to five accounts in 8 minutes, then to cash. The AI drafts the suspicious-transaction report.",before:["Complaint arrives","Analyst reads statements by hand","Report written manually"],breakAt:[1],after:["Complaint arrives","Money trail mapped automatically","AI drafts the report"],fixAt:[1,2],how:["Load transactions","Find fast money chains","Explain the ring","Draft the report"],tools:[{name:"BigQuery",does:"Transactions"},{name:"Python graph analysis",does:"Money chains (BigQuery Graph now needs a paid plan)"},{name:"Gemini 3.8 Flash",does:"Writes the report"}],data:"IBM AMLSim / SAML-D synthetic laundering data.",build:["Load data","Graph features","Report writer","Review screen"],competition:"High",difficulty:"Medium",wow:"Medium",similar:"Won RBI HaRBInger 2024 and a public-sector bank hackathon in 2026; Google publishes a similar sample.",watchOut:"Looks like Google's own codelab.",verdict:"Skip: crowded."},{id:"health",track:"bfsi",pick:"Skip",title:"Spot padded hospital bills in insurance claims",problem:"Some hospital claims are inflated (extra days, split charges). India loses Rs 8-10k crore a year this way; reviewers check by hand under time pressure.",solution:"AI compares the discharge summary, bill and policy, flags suspicious items with the exact clause, and drafts a polite query letter.",story:"A 58-year-old in Nagpur is hospitalised for dengue for 5 days with a Rs 1.42 lakh bill. The AI notes guidelines suggest 3 days and a lab test billed twice, and writes the query.",before:["Hospital sends the bill","Reviewer checks by hand","Padding slips through or gets disputed"],breakAt:[2],after:["Hospital sends the bill","AI checks against policy and guidelines","Clause-cited query letter"],fixAt:[1,2],how:["Read documents","Compare with policy","Flag items","Draft letter"],tools:[{name:"Gemini 3.8 Flash",does:"Reads long medical documents"},{name:"BigQuery",does:"Hospital billing patterns"}],data:"Synthetic claim packs.",build:["Document reading","Policy rules","Flags","Letter"],competition:"High",difficulty:"Medium",wow:"Low",similar:"Google's own ADK sample does claim adjudication; Vitraya and Medi Assist sell it.",watchOut:"Needs clinically credible data.",verdict:"Skip: crowded and hard to demo."},{id:"msme",track:"bfsi",pick:"Skip",title:"Show small businesses how a bank sees their loan application",problem:"Small business owners get rejected for loans without knowing why; their records are messy.",solution:"AI reads their records, explains how a lender will judge them in plain Hindi, and lists fixes.",story:"Meena runs a tailoring unit in Indore. She uploads bank PDFs and a photo of her ledger. The AI says: 'Your deposits don't match your GST sales by 30%; deposit sales into one account for 3 months.'",before:["Applies with messy records","Rejected","Never told why"],breakAt:[2],after:["Uploads records","AI explains the lender's view","Gets a 90-day fix plan"],fixAt:[1,2],how:["Read records","Apply lender rules","Explain in plain language","Fix plan"],tools:[{name:"Gemini 3.8 Flash",does:"Reads statements and ledger photos"},{name:"Gemini Live",does:"Explains by voice"}],data:"Synthetic statements.",build:["Upload","Rules","Explanation","Plan"],competition:"High",difficulty:"Medium",wow:"Medium",similar:"Won Gen AI Exchange 2024 (Aarthik Setu); several Devpost builds.",watchOut:"Already rewarded at a Google event.",verdict:"Skip: crowded."},{id:"austrac",track:"bfsi",pick:"Skip",title:"Anti-money-laundering paperwork for Australian small firms",problem:"From July 2026, Australian real-estate agents, accountants and lawyers must run anti-money-laundering checks, with no compliance staff.",solution:"AI reads client documents, finds who really controls trusts and companies, screens names and drafts reports.",story:"Sarah, a solo conveyancer in Melbourne, takes a client buying through a family trust. The AI lists who controls the trust, screens them, and flags overseas funds.",before:["New legal duty","No staff or tools","Manual checks"],breakAt:[1],after:["Upload documents","Owners identified and screened","Report drafted"],fixAt:[1,2],how:["Read documents","Find owners","Screen names","Draft report"],tools:[{name:"Gemini 3.8 Flash + Search grounding",does:"Reads documents and screens names"}],data:"Synthetic trust deeds.",build:["Upload","Owner map","Screening","Report"],competition:"High",difficulty:"Medium",wow:"Low",similar:"17+ commercial tools already.",watchOut:"Australia-only story.",verdict:"Skip: crowded and narrow."}],q0=[{id:"kotsu",track:"mfg",pick:"Possible",title:"Capture a veteran worker's know-how before they retire",problem:"Experienced workers know by sound or feel when a machine is set right, but it's never written down. New workers learn by watching for about 5 years, and their mistakes show up later as defects or accidents.",solution:"The expert films a task on a phone. AI finds the moments where they made a judgment call, replays each moment and asks 'what were you checking here?', and turns the answers into a guide in the new worker's language. It then checks the new worker's attempt and turns their mistakes into new questions for the expert.",story:"Sato-san, 63, sets up stamping dies in a 40-person factory in Aichi and retires in March. He knows a die is set right by the sound it makes when he taps it. Nguyen, 24, an intern from Vietnam, has the manual, which doesn't mention the sound. Our AI replays Sato-san's video at 1:42 and asks what he was listening for; his answer and the reference sound go into a Vietnamese guide. When Nguyen skips a step, the AI flags it and asks Sato-san a new question.",before:["Novice watches the expert for years","The manual lists steps, not the 'why'","Expert retires; knowledge leaves","Mistakes show up as defects or accidents"],breakAt:[1,3],after:["Expert films one task on a phone","AI asks about each judgment moment","Guide with clips and sounds, in Vietnamese","Novice's mistakes become new questions; guide v2"],fixAt:[1,2,3],how:["Expert films a task","AI finds judgment moments","Voice interview on each clip","Guide in the novice's language","Check the novice; ask new questions"],tools:[{name:"Gemini 3.8 Flash (video understanding)",does:"Finds the moments where the expert pauses, checks or listens"},{name:"Gemini Live",does:"Interviews the expert by voice while replaying the clip"},{name:"ADK",does:"Runs the steps: find moments, interview, write guide, verify"},{name:"Cloud Storage",does:"Holds the videos and reference sounds"},{name:"BigQuery",does:"Stores each 'cue, decision, reason' rule"},{name:"Cloud Run",does:"Hosts the app"}],data:"Our own phone videos, plus IndustReal and Assembly101 (public assembly videos with labelled mistakes).",build:["Upload a task video; Gemini lists the judgment moments with timestamps","Clip-based voice interview with Gemini Live","Guide builder: steps + clips + sounds + the 'why', translated","Verify mode: a separate checker model reviews the novice's video","Mistakes become new questions; guide v2 shows what changed"],competition:"High",difficulty:"Hard",wow:"High",similar:"Many tools in Japan: Emuni (did a webinar with Google Cloud), Chubu Electric's AI Manual Coach, NTT DATA, tebiki, Augmentir. Only the clip-based interview and the mistake loop are new.",watchOut:"Japanese judges will know the competitors. Live video sessions drop after about 2 minutes, and the AI can 'see' the step it expects, so verification needs a separate checker.",verdict:"Real and moving story, but crowded in Japan. Only pick it if a teammate has factory access and Japanese context.",arch:[{title:"Expert's phone video",sub:"Uploaded to Cloud Storage"},{title:"Gemini video understanding",sub:"Finds judgment moments"},{title:"Gemini Live interview",sub:"Asks about each clip"},{title:"Guide builder",sub:"Rules + clips + sounds, translated"},{title:"Verify with a separate checker",sub:"Reviews the novice's video"},{title:"BigQuery",sub:"Knowledge records; mistakes become new questions"}],demo:[{t:"0:00-0:15",line:"Hook: 'Sato-san retires in March. He knows a die is set right by the sound. Nguyen has the manual, and it doesn't say that.'"},{t:"0:15-0:40",line:"Sato-san films the die change; Gemini marks four judgment moments on the timeline."},{t:"0:40-1:05",line:"The clip at 1:42 replays; the agent asks in Japanese what he was listening for. His answer becomes a rule with the sound attached."},{t:"1:05-1:20",line:"The guide appears in Vietnamese. Nguyen's attempt is checked: step 6 skipped, flagged."},{t:"1:20-1:30",line:"Nguyen's mistake becomes a new question for Sato-san; guide v2 shows the change."}],plan:[{t:"Fri Oct 9",line:"Record 3-4 expert task videos (or use dataset clips); Google Cloud project"},{t:"Sat Oct 10",line:"Gemini finds judgment moments; skeleton deployed"},{t:"Sun Oct 11",line:"Team list locks. Clip-based voice interview with Gemini Live"},{t:"Mon-Tue Oct 12-13",line:"Guide builder and translation (Japanese / Vietnamese)"},{t:"Wed Oct 14",line:"Verify mode with a separate checker; mistakes become questions; guide v2"},{t:"Thu Oct 15",line:"Test on clips with known mistakes; get accuracy numbers"},{t:"Fri Oct 16",line:"Record the video; write the deck and README"},{t:"Sat Oct 17",line:"Submit, then freeze the repo"}]},{id:"phone",track:"mfg",pick:"Skip",title:"Check machine health with just a phone",problem:"Small factories in India have no sensors, so machines run until they break. Sensor systems cost lakhs.",solution:"The operator records 10 seconds of machine sound, photographs the gauge and leaves a voice note. AI compares it with that machine's normal sound and says 'keep running / watch / stop and call the mechanic'.",story:"Ravi's CNC lathe in Rajkot sounds 'off'. He records it; the AI says the sound differs from last week's normal recording, the oil gauge is low, and he should stop before the bearing fails.",before:["Machine sounds odd","Operator guesses","Breakdown and lost days"],breakAt:[1],after:["10-second recording + gauge photo","Compared with the machine's normal sound","Clear 'run / watch / stop' advice"],fixAt:[1,2],how:["Record sound and photo","Compare with baseline","Gemini explains","Advice in Hindi"],tools:[{name:"Gemini 3.8 Flash",does:"Hears the sound, reads the gauge, explains in Hindi"},{name:"Audio embeddings",does:"Compares today's sound with the machine's normal sound"},{name:"BigQuery + Cloud Run",does:"History and the app"}],data:"MIMII and DCASE public machine-sound datasets.",build:["Record","Baseline compare","Explain","History"],competition:"High",difficulty:"Medium",wow:"Medium",similar:"SonicFix and MachMind AI (hackathons), Sensorry (startup).",watchOut:"AI diagnosing from sound alone is unproven.",verdict:"Skip: crowded."},{id:"cbam",track:"mfg",pick:"Skip",title:"Carbon paperwork for small exporters to Europe",problem:"Since 2026 the EU charges a carbon fee on imported steel and aluminium; without real data, buyers use penalised default values. Small Indian forges keep records on paper.",solution:"AI reads photos of electricity bills and furnace logs, calculates emissions per product, and drafts the data pack for the EU buyer.",story:"A 15-person forging unit in Ludhiana gets an email from its German buyer asking for emissions data. The owner photographs 3 months of bills and logs; the AI produces the numbers and the penalty avoided.",before:["Buyer asks for emissions data","Records on paper","Buyer uses penalised defaults or drops the supplier"],breakAt:[2],after:["Photograph bills and logs","Emissions per product calculated","Data pack for the buyer"],fixAt:[1,2],how:["Photos in","Gemini extracts numbers","BigQuery calculates","Pack out"],tools:[{name:"Gemini 3.8 Flash",does:"Reads bills and handwritten logs"},{name:"BigQuery",does:"Emissions calculations"}],data:"Synthetic plant records; EU default values.",build:["Extraction","Calculation","Pack"],competition:"High",difficulty:"Medium",wow:"Low",similar:"Indian products already take handwritten logs and voice notes (CarbonSettle and others).",watchOut:"Overlaps with Sustainability carbon entries.",verdict:"Skip: crowded."},{id:"supply",track:"mfg",pick:"Skip",title:"Warn small suppliers about shortages early",problem:"When export bans or shipping crises hit, small suppliers
