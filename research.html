t demo Marathwada (Sep 2025) or Punjab (2025): Maharashtra notified no localized cover for Kharif 2025 and Punjab doesn't run PMFBY.","Verify within 48 hours that Odisha's Kharif 2026 notification includes paddy inundation as a localized risk.","Don't promise a payout estimate: localized payouts follow state-notified input-cost percentages, so estimates risk repeating the Rs 1-claim expectation gap.","Earth Engine access: register a noncommercial Contributor project now (1,000 compute-hours/month, billing account but not charged). Startup product R&D counts as commercial, and Earth Engine data inside BigQuery works only in US / EU regions, so precompute results."]},{id:"heat",rank:2,title:"Humid-heat check-in for elderly people living alone and outdoor workers",oneLiner:"Heat kills people who are alone at home with the air conditioner off, and regional alerts never reach them as an individual check.",verdict:"Strongest evidence and widest JAPAC reach, but the most crowded in Japan (AI calling services and workplace wearables already exist).",today:[{label:"1. Coarse alerts",detail:"Japan issues a regional alert if any point hits WBGT 33; the 'special' alert (WBGT 35 everywhere) has never been issued. A record 1,749 alerts in 2025. India's IMD warns by district; only 10 of 37 heat plans set local thresholds."},{label:"2. The household doesn't act",detail:"Tokyo 2025: 152 of 181 indoor heatstroke deaths lived alone; 121 had an air conditioner that was off. July 2026: only 13 of 81 indoor deaths were using cooling. Some ACs were on heating or fan mode.",broken:!0},{label:"3. Community checks are thinning",detail:"Japan's welfare volunteers are 20,091 short (lowest fill rate since the war); 41% are in their 70s.",broken:!0},{label:"4. Employers rarely stop work (India)",detail:"An Ahmedabad audit found only 2 of 60 sites stopped work at peak hours. 2025: 14 official deaths vs at least 84 tracked by media, including days with no alert.",broken:!0},{label:"5. Ambulances overloaded",detail:"Tokyo Fire Department: 9,125 heat transports Jun-Sep 2025, a record; 52.6% aged 65+."}],tools:[{tool:"NAVER CareCall (via LINE WORKS, Apr 2026)",users:"Japanese municipalities",does:"AI phone monitoring of elderly residents",gap:"General wellbeing calls; not triggered by the heat at the person's address"},{tool:"NTT Docomo AI phone, Beiju, Nomi city",users:"Municipalities",does:"AI calls, home sensors, smart-AC data",gap:"Pilots; none combine all four pieces below"},{tool:"Workplace wearables (since Jun 2025 legal duty)",users:"Japanese employers",does:"Worker vital monitoring",gap:"Crowded; workplace heat deaths already fell 39%"},{tool:"SEWA heat insurance (India)",users:"Informal women workers",does:"Parametric payout ~US$8 per worker",gap:"Compensates after the fact; no check-in"}],noneDo:["Trigger on the forecast heat at the person's own address, not the whole region","Confirm the air conditioner is actually cooling","Escalate to family, volunteers or the local elderly-support centre when there's no answer","Keep a log the municipality can act on"],stepIn:"A voice agent calls when forecast WBGT at the home reaches 28-31, confirms the AC is in cooling mode, and escalates if the person doesn't answer. Payers: Japanese municipalities (Izumo plans an AI-phone monitoring fee), employers under the 2025 duty, Indian municipal heat cells.",whyMissed:"Alerts are one-way and regional; existing AI call services aren't driven by heat forecasts.",demo:"Replay 5 Aug 2025 (a record 45 regions under alert) for an 84-year-old living alone in Adachi ward, Tokyo. Live hook in India: IMD issued a 'hot and humid' alert for Mumbai on 6-7 Oct 2026 (37.4\xB0C).",data:"WeatherNext 2, ERA5-Land, MODIS LST, Japan MoE WBGT data, FDMA heatstroke data",stack:"Earth Engine, Gemini Live, BigQuery, Pub/Sub, Cloud Run",risk:"Japan's alert season ends 21 Oct, so a Japan demo is a replay. CareCall could add heat triggers quickly."},{id:"alert",rank:3,title:"Two-way alert-to-action layer",oneLiner:"Official alerts are generic one-way broadcasts with no record of who is safe.",today:[{label:"Broadcast",detail:"Sachet / CAP SMS and cell broadcast."},{label:"Generic and delayed",detail:"Not hyperlocal; SMS delays over large areas."},{label:"No acknowledgement",detail:"No list of who hasn't confirmed safety; IOM says feedback mechanisms are limited.",broken:!0}],stepIn:"Rewrite alerts into household-level instructions by voice in dialect, record acknowledgements, and show officials who hasn't confirmed, prioritizing vulnerable people.",whyMissed:"Existing systems are one-way.",demo:"A cyclone alert reaches a village; the dashboard shows unconfirmed households.",data:"GDACS, Flood Hub, IMD, Open Buildings",stack:"Gemini Live, Pub/Sub, BigQuery, Cloud Run",risk:"Looks like 'another alert app' unless the two-way loop is central."},{id:"entitle",rank:4,title:"Entitlement navigator that fixes document problems",oneLiner:"People are excluded from welfare because of document mismatches, not lack of awareness.",verdict:"Well evidenced but incremental next to Haqdarshak, myScheme and government chatbots, and it demos poorly.",today:[{label:"1. Learns of scheme",detail:"Via myScheme, Haqdarshak, agents or CSCs."},{label:"2. Gathers documents",detail:"Aadhaar, land record, bank passbook, certificates."},{label:"3. Applies at a CSC",detail:"Agent fees are common: Rs 101 paid on average for a Rs 30 certificate."},{label:"4. Payment rejected for mismatches",detail:"Aadhaar not mapped to an active bank account, one-letter name differences ('Anita' vs 'Aneeta'). 30.2 lakh PM-KISAN farmers pending Aadhaar-bank seeding (Feb 2026); 87% of traced PMMVY maternity beneficiaries in Chhattisgarh unpaid because of typos; MGNREGA job-card deletions up 247% during Aadhaar payments rollout.",broken:!0}],noneDo:["Compare names across a person's documents, allowing for transliteration, and say exactly which office and form fixes each mismatch"],stepIn:"Gemini vision reads n:["Accessibility built with a real, named user (Gemma Vision, Vite Vere, Gaze Link, 3VA)","Replacing one broken manual process with a measured time saving (Medicall, AshaAI, GuruMitra)","Satellite data plus an LLM on Google's stack (GeoGemma, Globot)","Multi-agent crisis command with visible human approval (Aegis)","Voice-first, low-literacy, offline designs"],didntWin:["Farmer super-apps (crop doctor + prices + schemes + weather): dozens at Agentic AI Day 2025, none shortlisted","Flood-prediction dashboards with a Gemini chatbot","Offline disaster assistants","Scheme-finder chatbots (except sub-prizes)","Blockchain-first insurance or waste tokens"]}},Wt={facts:[["Organizer","Hack2skill, sponsored by Google Cloud ('independently operated by Hack2skill'). Appears to be the first edition; likely the 'Grand Hackathon' promised by Gen AI Academy APAC 2026 (inferred)."],["Dates","Registration and team formation Sep 1 - Oct 11 (no roster changes after Oct 11). Build window Sep 7 - Oct 18. Evaluation Oct 19 - Nov 6. Finalists Nov 7. Grand Finale in person in Singapore, Dec 4."],["Deadline time","No time of day or timezone published for Oct 18. Plan to submit Oct 17."],["Team","2-4 members, no solo entries. Only 2 members may attend the finale. One team per person, one solution, one theme."],["Eligibility","21+, working professionals / entrepreneurs / startups. Any full- or part-time student disqualifies the whole team, even after the finale. Must live in JAPAC; cross-country teams allowed."],["Required tech","Gemini or Gemma (or built on Agent Platform, Antigravity or AI Studio). Deployed on Google Cloud via Cloud Run or Firebase. Solutions 'built primarily on competing cloud infrastructure' are disqualified."],["Submission","Working deployed URL; video strictly under 3 minutes (public YouTube / Vimeo / Drive); public GitHub repo; deck exported to PDF covering architecture and business case; chosen problem statement. English only."],["Fresh code","Code and assets must be  Runtime, Cloud Run, BigQuery, Firebase)","Beyond the chatbox: voice, vision and the physical world. A partner developer advocate told Cup builders: 'Don't build another AI chatbot.'","A hard impact number plus local relevance (e.g. '70% less prep time, 22+ languages')","Trust built in: privacy, safety design, governance. In BFSI, fraud and scam detection is a recurring winner (Kavach AI won best multi-model integration in Gen AI Academy cohort 2)","Demo craft: a real user moment, plus a test login and seeded data so judges can use the deployment"],winners:[["Gen AI Exchange 2025 (India, pro track)","Skippers (PRDs to compliant test cases in Jira), May The Agents Be With You (cement plant agents with human approval), PitchLense, TripAI, GovernAI"],["Agentic AI Day 2025 (Bengaluru)","GuruMitra (teachers, 70% less prep), CrowdSense, Kovai Shines, Raseed, Artha (files tax returns)"],["Gen AI Academy APAC 2026","Cohort 2 awards: Kavach AI (scam/fraud detection), SchoolZone Guardian, NeuroFlow, NestIQ"],["Zenn x Google Cloud (Japan)","eCoino (supply chain), FlatJam, Fukushia (social-worker assessments on Firebase + Cloud Run), Anatom-AI, BrickQuest"],["ADK Hackathon 2025","SalesShortcut (grand prize), GreenOps (APAC), TradeSageAI (honorable mention)"],["Gemini Live Agent Challenge 2026","ORION (surgical co-pilot), drone-copilot, Sankofa, Moonwalk, Wand; HMs NagarDrishti, Ekaette, Call My Parts"],["Google for Startups AI Agents Challenge 2026","Vita Care (A2A family health agents), Ysquare Kiosk as a Service (APAC), SilverGrove"]],tech:[["gemini-3.8-flash","GA (Sep 2)","1M input / 65k output tokens; free tier on Gemini API; not a Live model. Use as the orchestrator."],["gemini-3.8-live","GA","Native audio, async function calls, Search grounding. 131k input tokens. Use for voice."],["gemini-3.5-flash-lite","GA","Cheap sub-agent / classification tier ($0.30 in / $2.50 out per 1M)."],["gemini-3.1-pro-preview","Preview only","No free tier, tighter rate limits. Gemini 3.5 Pro
