s engines can flag the payment, but the intervention that follows is still a static pop-up, a call-back or a teller's instinct. Liability is shifting onto banks: RBI's amended directions (for transactions from 1 Jan 2027) treat approval 'under coercion or duress' as fraud and put the burden of proof on the bank; Korea's pending no-fault bill and Australia's Scams Prevention Framework codes (from 31 Mar 2027) do similar. An auditable intervention record becomes valuable."},stats:[{region:"India",fact:"Cyber-fraud losses reported to I4C: Rs 22,495 cr in 2025 (24.0 lakh complaints), vs Rs 22,848 cr in 2024 and Rs 7,465 cr in 2023. More than Rs 8,189 cr saved in total through the fraud-reporting system.",src:[["PIB","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2226441&lang=1&reg=3"]]},{region:"India",fact:"Investment scams were 76% of 2025 losses; digital arrest about 9%; sextortion about 4%. Banks have shared 24.67 lakh mule accounts with I4C.",src:[["ThePrint","https://theprint.in/india/cybercrime-saw-24-spike-in-2025-indians-lost-rs-22495-crore-mainly-in-investment-scams/2859930/"]]},{region:"India",fact:"Digital arrest: 1,23,672 cases and Rs 1,935 cr lost in 2024. The Supreme Court has directed states to adopt an SOP for temporary debit holds on suspicious accounts.",src:[["Indian Express","https://indianexpress.com/article/legal-news/digital-arrest-fraud-sop-mule-accounts-supreme-court-states-uts-10817890/"]]},{region:"India",fact:"RBI FY25 bank frauds: 23,953 cases, Rs 36,014 cr. Digital payments were 56.5% of cases but only Rs 520 cr; loan frauds were 92% of value.",src:[["RBI Annual Report","https://www.rbi.org.in/Scripts/AnnualReportPublications.aspx?Id=1436"],["Business Standard","https://www.business-standard.com/finance/news/bank-fraud-amount-triples-in-fy25-despite-drop-in-number-of-cases-rbi-125052900696_1.html"]]},{region:"India",fact:"UPI frauds: 13.42 lakh cases and Rs 1,087 cr in FY24.",src:[["Lok Sabha reply","https://www.medianama.com/wp-content/uploads/2024/11/Lok-Sabha-Question-Fraud-in-UPI-Transactions.pdf"]]},{region:"India",fact:"MuleHunter.AI (RBI's mule-detection model): 23 banks live by Dec 2025, about 20k mules detected per month, claimed 85-90% accuracy.",src:[["MediaNama","https://www.medianama.com/2025/12/223-rti-23-banks-mulehunter-mule-accounts/"]]},{region:"India",fact:"DPIP (RBI's shared fraud-intelligence platform): Smart Registry live with 8 banks from Sep 1, 2026. Real-time transaction scoring still in user acceptance testing.",src:[["MediaNama","https://www.medianama.com/2026/09/223-dpip-smart-registry-fraud-prevention/"]]},{region:"India",fact:"Health-insurance fraud, waste and abuse: Rs 8,000-10,000 cr a year (8-10% of claim payouts). About 2% outright fraud; 8% is a grey zone; mid-ticket claims (Rs 50k-2.5L) leak the most.",src:[["BCG","https://www.bcg.com/publications/2025/india-rebuilding-trust-combating-fraud-waste-and-abuse-in-indias-health-insurance-ecosystem"]]},{region:"India",fact:"MSME addressable credit gap: Rs 30 lakh cr (24%). Higher for women-owned (35%), trading (33%) and services (27%).",src:[["SIDBI","https://www.sidbi.in/uploads/Understanding_Indian_MSME_sector_Progress_and_Challenges_13_05_25_Final.pdf"]]},{region:"India",fact:"RBI FREE-AI framework (Aug 2025): 7 principles and 26 recommendations emphasising explainability and human oversight.",src:[["RBI","https://www.rbi.org.in/scripts/BS_PressReleaseDisplay.aspx?prid=61018"]]},{region:"Singapore",fact:"S$913.1M lost to scams in 2025 (down 17.9%). Investment and government-impersonation scams lead. The police Anti-Scam Command averted S$348M.",src:[["SPF Brief 2025","https://www.police.gov.sg/-/media/SPF/Media-Room/Statistics/Annual-Scams-and-Cybercrime-Brief-2025/Annual-Scam-and-Cybercrime-Brief-2025.pdf"]]},{region:"Singapore",fact:"The Shared Responsibility Framework covers phishing only. Police can freeze a victim's banking for up to 30 days. Banks hold or reject transfers when more than 50% of a S$50k+ balance leaves within 24h.",src:[["MAS SRF","https://www.mas.gov.sg/regulation/guidelines/guidelines-on-shared-responsibility-framework"],["CNA","https://www.channelnewsasia.com/singapore/banks-hold-reject-transfers-anti-scam-measure-oct-15-5383281"]]},{region:"Australia",fact:"A$2.03B in combined reported scam losses in 2024; bank transfers caused the largest losses (A$141.7M on Scamwatch).",src:[["Scamwatch","https://www.scamwatch.gov.au/about-us/news-and-alerts/australians-better-protected-as-reported-scam-losses-fell-by-almost-26-per-cent"]]},{region:"Australia",fact:"Scams Prevention Framework Act 2025 requires banks, telcos and platforms to prevent, detect, disrupt, report and respond to scams. AFCA got 6,228 scam complaints in 2025; only 4.8% of final determinations gave full reimbursement.",src:[["Act","https://www.legislation.gov.au/C2025A00015/asmade/2025-02-20/text/original/pdf"],["AFCA","https://www.afca.org.au/news/latest-news/receiving-banks-jurisdiction-for-scam-complaints"]]},{region:"Australia",fact:"AUSTRAC Tranche 2 AML obligations hit lawyers, accountants, real-estate agents and similar from 1 Jul 2026. Suspicious matter reports due within 3 business days.",src:[["AUSTRAC","https://www.austrac.gov.au/sites/default/files/2025-07/AMLCTF_obligations_factsheet_for_tranche_2_REs.pdf"]]},{region:"Korea",fact:"Voice-phishing losses hit a record W1.26T in 2025 (up 47%); 78.6% from impersonating prosecutors, police or the regulator. Only 26.3% refunded. A no-fault bill would split liability 50/50 and shift the burden of proof to banks.",src:[["Asia Business Daily","https://www.asiae.co.kr/en/article/2026092909212937610"],["Korea Times","https://www.koreatimes.co.kr/economy/20260729/banks-face-full-liability-for-voice-phishing-compensation"]]},{region:"Japan",fact:"Special fraud plus social-media investment and romance scams reached Y325.7B in 2025 (up 63.6%). 59.2% of special-fraud losses borne by people aged 65+.",src:[["NPA","https://www.npa.go.jp/bureau/criminal/souni/tokusyusagi/sagi_keihatsu2025.pdf"]]},{region:"SE Asia",fact:"Estimated US$23.6B lost; 63% of adults experienced a scam; two-thirds of scams complete within 24h; only 22% recovered anything.",src:[["GASA","https://gasa.org/knowledge-base/blog/new-study-reveals-63-of-southeast-asians-experienced-scams-in-past-year"]]},{region:"Philippines",fact:"The Anti-Financial Account Scamming Act criminalises money muling. Banks can hold disputed funds for up to 30 days.",src:[["BSP Circular 1215","https://www.bsp.gov.ph/Regulations/Issuances/2025/1215.pdf"]]},{region:"APAC",fact:"Synthetic-identity fraud up 142% YoY; deepfakes up 408% in Malaysia and 158% in Singapore. India's PAN card is the most-targeted ID document (27%).",src:[["Sumsub","https://www.prnewswire.com/apac/news-releases/annual-sumsub-report-reveals-synthetic-personal-data-in-apac-soars-142-yoy-amidst-fraud-crackdowns-302625327.html"]]},{region:"APAC",fact:"About US$45B a year spent on financial-crime compliance across 5 markets; labour is 41% of it.",src:[["LexisNexis","https://risk.lexisnexis.com/global/en/about-us/press-room/press-release/20240306-true-cost-of-compliance"]]}],statCaveats:["India digital-arrest 2025 numbers conflict across sources; cite the 2024 figures.","RBI FY25 fraud value is inflated by Rs 18,674 cr of reclassified older cases.","Korea W1.26T (police) and W433.8B (regulator, narrower scope) measure different things.","GASA and LexisNexis figures are survey-based estimates; BioCatch and MuleHunter accuracy claims are self-reported."],incumbents:[{name:"BioCatch (Scams360)",category:"Behavioural scam signals",does:"About 3,000 behavioural and device signals (hesitation, active call, remote-access apps). Australian inter-bank network covers 85%+ of the banked population.",gap:"Produces a risk score; the intervention is left to the bank's UI or call centre. Needs an SDK in each channel plus analysts. Never talks to the victim."},{name:"Feedzai (ScamPrevent, ScamAlert)",category:"Fraud / scam platform",does:"Real-time transaction and behavioural scoring. ScamAlert is a GenAI agent that checks uploaded screenshots.",gap:"Upload-only screenshots. Nothing live by voice and nothing after the loss (recovery or disputes)."},{name:"Featurespace / Visa ARIC",category:"Transaction monitoring",does:"Adaptive behavioural profiling and real-time payment scoring.",gap:"Enterprise and card-network oriented. Detects anomalies but cannot see coercion the victim authorizes."},{name:"Sardine",category:"Fraud + AML + KYC",does:"Device intelligence, consortium data, AI agents, automated US SAR filing; India and Australia data centres.",gap:"US-first workflows (FinCEN only). Little evidence of APAC regulatory workflows (inference)."},{name:"Google Cloud AML AI",category:"AML risk scoring",does:"Monthly per-customer risk scores with explanations. HSBC reports 2-4x more true positives and 60% fewer alerts.",gap:"Monthly batch, not real time. Needs the bank's own suspicious-activity history. Not usable by small banks."},{name:"RBIH MuleHunter.AI / DPIP",category:"Mule and payment risk (India)",does:"Free mule-account detection; shared transaction risk scores.",gap:"23 banks on MuleHunter, 8 on DPIP. Scores only; co-op banks, small NBFCs and most small institutions left out."},{name:"NPCI fraud monitoring",category:"UPI network monitoring",does:"AI/ML alerts and declines for banks.",gap:"Network-level only; no customer-facing intervention."},{name:"Truecaller AI Call Scanner",category:"Consumer caller ID",does:"Detects AI-generated voices; context labels for incoming calls.",gap:"Detects synthetic voices, not human scammers following a script. Premium only; India in beta. Not tied to the bank's payment decision."},{name:"Whoscall (Gogolook)",category:"Consumer anti-scam app",does:"Caller ID, SMS and link checks across Taiwan, Thailand, Malaysia, Korea, Japan.",gap:"Reputation database only; doesn't follow a scam as it unfolds or connect to the bank."},{name:"IDfy, Signzy, HyperVerge, Bureau",category:"KYC / onboarding",does:"Video KYC, document checks, liveness, device risk graphs. IDfy works with ~70% of large Indian banks and NBFCs.",gap:"Strong at onboarding; post-onboarding fraud (mules, scam payouts) mostly out of scope. Crowded."},{name:"Perfios (+ Clari5, Karza)",category:"Statement analysis, fraud, AML",does:"Statement and GST analysis for lenders; Clari5 processes ~10B transactions per month.",gap:"Sells to lenders via API. No borrower-facing view; weak on informal, vernacular and handwritten records."},{name:"Shift Technology",category:"Insurance claim fraud",does:"GenAI visual intelligence for Tokio Marine; Orix Life going live in 2026.",gap:"Large insurers; little presence with mid-tier Indian or SEA insurers and TPAs. Focus on outright fraud, not the grey zone."},{name:"Tractable",category:"Visual damage assessment",does:"Car damage estimation from photos; sold its Japan property business in 2025.",gap:"Auto only; no health claims."},{name:"Medi Assist MAven Guard",category:"Health-claim integrity (India)",does:"Self-learning model for health-claim fraud, waste and abuse.",gap:"Used inside Medi Assist's own claims business; not sold to others."}],overdone:[{pattern:"Kaggle fraud classifier (PaySim, ULB, IEEE-CIS) with an LLM explaining the result",examples:[["Argus","https://devpost.com/software/argus-gqa7b3"],["PaySim + RAG","https://devpost.com/software/ai-fraud-detection-zheb3s"]]},{pattern:"Multi-agent Detective / Judge / Enforcer fraud pipelines",examples:[["StreamGuard","https://devpost.com/software/streamguard-l08zx6"]]},{pattern:"Phishing SMS / email classifiers",examples:[["Fraud Shield","https://devpost.com/software/fraud-shield"]]},{pattern:"Personal-finance and budgeting chatbots with account links",examples:[["FinGuard AI","https://devpost.com/software/finguard-ai"],["Gemini API competition","https://ai.google.dev/competition"]]},{pattern:"Policy or fine-print summarisers built on RAG",examples:[]},{pattern:"Startup / investment analysts (won Gen AI Exchange 2025; many clones)",examples:[["Gen AI Exchange finale","https://blog.hack2skill.com/gen-ai-exchange-hackathon-finale"]]},{pattern:"Generic multi-agent KYC (Google published a ready-made blueprint)",examples:[["Google ADK KYC blueprint","https://cloud.google.com/blog/products/ai-machine-learning/build-kyc-agentic-workflows-with-googles-adk"]]},{pattern:"Receipt or expense auditors",examples:[["AuditAI","http://github.com/DeathGun44/cloud-run-AuditAi"]]}],overdoneNote:"Gen AI Exchange 2025 (India, ~4,400 prototypes): the only fintech winner was PitchLense, a startup analyst. ADK Hackathon: the only finance entry was an honourable mention (TradeSageAI). SFF Hackcelerator 2025 rewarded narrow B2B workflows with a clear buyer.",gaps:[{id:"hold",rank:1,title:"Coercion check during a held payment (bank-side, JAPAC)",oneLiner:"Banks can now spot a likely coerced payment and are being told to hold it, but nobody in JAPAC has built the conversation during the hold: one a coached victim can't pass, that leaves a record which holds up when the regulator, ombudsman or court asks.",verdict:"Real, clear and the strongest demo. The generic idea isn't new globally (Westpac SaferPay, Revolut, Starling, a near-identical 'Second Voice' hackathon entry), so differentiate on the JAPAC version: bank-side, in local languages, aimed at law-enforcement impersonation, usable at branches, with a record mapped to the new liability rules.",today:[{label:"1. Contact",detail:"A call from 'TRAI', 'customs' or 'police' is handed to a 'CBI/ED officer': the victim's SIM or Aadhaar is 'linked to money laundering'. Forged documents, sometimes a staged online 'court hearing'."},{label:"2. Isolation and coaching",detail:"Round-the-clock WhatsApp video surveillance; told not to contact anyone; given cover stories for bank staff ('property, car, charity')."},{label:"3. Transfer in tranches",detail:"Victims break FDs and send RTGS from branches or net banking with the 'officer' on screen: 14 transactions over 20 days (Hyderabad), 21 RTGS on 21 branch visits for Rs 22.92 cr (Delhi)."},{label:"4. Bank response today",detail:"Mostly branch-manager instinct (SBI Delhi, Axis Pune, South Indian Bank Kochi). HDFC runs a voluntary dual OTP for over-60s in ~50 branches. MuleHunter flags the receiving mule accounts, not the victim's decision."},{label:"5. Interventions fail",detail:"Coached cover stories pass checks; 21 branch visits went unnoticed; the RBI's own proposal says 'if the payer still chooses to proceed, the transaction will be executed'.",broken:!0},{label:"6. Layering in minutes",detail:"Rs 3 cr left one mule account in 29 minutes; money moves through 7-20 layers into cash and USDT."},{label:"7. Realising and reporting",detail:"The 'arrest' lasts ~2 days plus a day before the alarm; the Rs 22.92 cr victim took 6 weeks. The 1930 helpline often takes 2-3 tries."},{label:"8. Recovery",detail:"Usually under 10%; one victim with a court order received Rs 20."}],voices:[{quote:"The fraudsters 'guided' the victims with what they should tell the bankers\u2026 Purchasing a car or property; charity work; and personal reasons were among their suggestions.",who:"The Hindu, Hyderabad Rs 5.66 cr case",url:"https://www.thehindu.com/news/national/telangana/hyderabads-566-crore-digital-arrest-scam-shines-spotlight-on-vulnerabilities-in-indian-banking/article68974005.ece"},{quote:"Each time, an officer's face would appear on screen to guide their trembling hands through the bank's online portal.",who:"India Today, Patna Rs 1.95 cr case",url:"https://www.indiatoday.in/india-today-insight/story/patna-couples-rs-195-cr-digital-arrest-shows-why-you-must-coach-parents-and-now-2737871-2025-06-09"},{quote:"Otherwise, he might have gone to a customer counter. The staff there may not have noticed his tension\u2026 It could have ended as another silent cybercrime.",who:"Kochi branch manager (Onmanorama)",url:"https://www.onmanorama.com/news/kerala/2025/12/18/never-seen-so-panicked-kochi-bank-manager-saved-elderly-customer-losing-4-5-lakh-digital-arrest-scam.html"},{quote:"Giving incorrect information would and did make it extremely difficult for Revolut to uncover the scam.",who:"UK Financial Ombudsman, DRN-5606797 (three interventions failed)",url:"https://www.financial-ombudsman.org.uk/decision/DRN-5606797.pdf"}],lists:[{title:"Six reasons today's interventions fail",items:["Coached cover stories: property, car, charity, a nephew's wedding, a renovation, 'it's my own account'","Counter-coaching against the intervention itself: scammers warn victims about 'police impersonators' and build props for counter staff","Victims trust 'authority' over the bank: in Delhi only real police in person convinced the victim; Ahmedabad took four hours of counselling","Human checks are inconsistent and don't scale: 21 branch visits passed unnoticed","The shift to digital removes the human: in Japan, fake-police transfers by internet banking (Y40.7B) now dwarf ATM and counter; staff prevention rate fell to 39.8%","Regulators' own designs stop at 'reconfirmation': if the payer proceeds, the payment executes"]}],extraTables:[{title:"The same journey in other markets",headers:["Market","Scale (2025)","What banks do at payment","Evidence of failure"],rows:[["Singapore","Government-official impersonation: 3,363 cases, S$242.9M (+60.5%); 81.8% of scams are self-effected transfers","12-hour cooling on new devices; 24-hour hold when >50% of a S$50k+ balance leaves; Money Lock; DBS cognitive breaks + human team","A 77-year-old told DBS staff the S$200k was for a 'nephew's wedding'; only 12 Restriction Orders issued"],["Australia","A$2.18B lost (+7.8%)","Confirmation of Payee (advisory); CBA CallerCheck; Westpac SaferPay dynamic questions","Scammers spoof CallerCheck by SMS; at non-major banks customers bore 96% of losses"],["Korea","Record W1.2578T; 78.6% government impersonation; avg W53.84M per victim","Teller questionnaire for W5M+ withdrawals; 30-min ATM delay; opt-in 3-hour delayed transfer","Victims 'trust police more than tellers'; funds converted to crypto before freezes"],["Japan","Special fraud Y142.3B (record); fake-police fraud Y100.5B","Police-backed staff checks; ATM limits for elderly; Osaka 65+ no-calls-at-ATM rule","Internet-banking share rising; staff prevention rate 39.8% (-9.5 pts); scammers send fake estimates to show counter staff"]]},{title:"Static pop-up vs human call-back vs the proposed agent",headers:["","Static pop-up","Human call-back","Proposed agent"],rows:[["Questions","Fixed yes/no","Scripted","Adaptive, in the customer's language, specific to the scam type"],["Checks the story against bank data","No","Rarely","Stated purpose vs beneficiary type, account age, the FD break"],["Detects coaching","No","Depends on the person","Scripted phrasing, hesitations, a third voice, 'Is someone on a call with you?'"],["Breaks the spell","Generic text","Varies","'No agency does digital arrest', then warm handoff to real police or family"],["Scale and cost","Free, ineffective","Expensive, limited","Cheap; escalates only hard cases"],["Record","Click log","Free-text notes","Structured, timestamped evidence"]]},{title:"Why the audit record matters, by jurisdiction",headers:["Jurisdiction","Rule (status)","What the record proves"],rows:[["India","RBI amended directions (24 Jun 2026, for transactions from 1 Jan 2027): approval 'under coercion or duress' is a fraudulent transaction (4(15A)); bank bears the burden of proving customer liability (76K); alerts and responses must be timestamped (76H). Draft debit-hold SOP from 1 Apr 2027.","Whether the customer was negligent or the bank deficient"],["Korea","Pending no-fault bill: banks pay unless they prove gross negligence or 'sufficient effort'; burden of proof on banks","'Sufficient effort' and warnings given"],["Australia","Scams Prevention Framework codes from 31 Mar 2027: targeted warnings, proportionate disruption; AFCA complaints","Reasonable, proportionate steps"],["Singapore","Loss-sharing excludes self-effected transfers; police Restriction Orders","Supports Restriction Order decisions"],["Philippines","AFASA s.9: institution liable if it fails to hold funds","That a hold and verification happened"]]}],tools:[{tool:"Westpac SaferPay (2024)",users:"Australian customers",does:"AI-triggered dynamic in-app questions; blocks payment",gap:"Tap answers; no voice or local language; results unpublished"},{tool:"Revolut flow + Scam Buster",users:"UK / EU customers",does:"Questionnaire, chatbot, call verification",gap:"Ombudsman case shows coached answers pass"},{tool:"Starling Assistant (Gemini, Jun 2026)",users:"UK customers",does:"Opt-in agent asks questions, suggests a call",gap:"Customer-initiated: the victim must volunteer the situation"},{tool:"BioCatch Scams360 / Feedzai",users:"Banks",does:"Behaviour and active-call detection; risk scores",gap:"Detection only; the bank still designs the intervention"},{tool:"Google Scam Detection / SKT / KT / Docomo",users:"Consumers",does:"On-call AI scam detection",gap:"See the call, not the payment decision; Pixels are <1% of India's phones"},{tool:"'Second Voice' (hackathon, 30 Sep 2026)",users:"Demo",does:"Voice check during a hold; detects a coach; points table decides; audit record",gap:"Almost the same concept, but UK-framed, English, n=9 test cases"}],stepIn:"Right after the hold is applied and before release, on three surfaces: the app hold screen (voice or chat), a branch-teller copilot (the largest Indian losses go through branch RTGS), and an outbound call to the registered SIM ('fraudsters control WhatsApp, they rarely control the SIM'). Triggered by the bank's existing signals: FD broken in the last 24 h + new payee + high share of balance, active call during the session, a MuleHunter / I4C-flagged beneficiary. Output: coercion score, reason codes, transcript (original + English), recommended action (release / extend hold / branch visit / trusted contact / police referral) and an evidence pack. Users: bank fraud-ops teams and tellers; payer: the bank's head of fraud or CRO, because liability is shifting.",whyMissed:"Detection vendors stop at scores; the existing conversational products are UK/Australia, English, tap-based or customer-initiated. No JAPAC bank has publicly announced a conversational coercion check (unannounced pilots may exist).",persona:"Shalini Deshpande, 64, retired teacher in Kothrud, Pune; widowed, son in Toronto; Rs 26 lakh in FDs. Day 2 of a digital arrest; told 'if bank asks, say it's for your son's flat'. She breaks an Rs 18 lakh FD and sends it to an 'RBI verification account': a 19-day-old current account in Jhajjar.",script:[{t:"0:00-0:12",line:"Staged WhatsApp clip of the 'officer' coaching her."},{t:"0:12-0:22",line:"Status quo: a pop-up asks 'Is someone asking you to pay? Yes / No'. She taps No; the money splits through layers. Caption: 'Rs 3 crore left one mule account in 29 min'."},{t:"0:22-0:30",line:"Rewind. The fraud console shows the signals (FD broken <24 h ago, new payee, 69% of balance, beneficiary 19 days old, mule flag) and applies the hold."},{t:"0:30-1:05",line:"The agent speaks Marathi (English subtitles). 'What is this payment for?' 'My son's flat.' (0.2). 'Which builder? When is registration?' Long pause (0.45). 'May I message Rohan?' 'No, don't tell him.' (0.78). 'Is anyone on a call with you?' A second voice is heard (0.94). The agent says police and CBI never do 'digital arrest' and offers 1930 and her son."},{t:"1:05-1:20",line:"Recommendation: extend hold 24 h, contact trusted person, pre-filled 1930 referral. Analyst approves with one click."},{t:"1:20-1:30",line:"Evidence PDF with timestamped warnings and answers mapped to RBI 4(15A) / 76H / 76K. Close: 'MuleHunter finds the mule. We talk to the victim and keep the receipt.'"}],credibility:"Measure it. Build ~240 synthetic dialogues (4 scam types x 3 languages x coached / genuine / ambiguous) from the real cover stories. Report recall on coached cases vs a static-questionnaire baseline, false-hold rate on genuine high-value payments (property, wedding, medical), median time to decision (target < 3 min vs 4-hour counselling), share resolved without a human, and evidence completeness. Public benchmarks: BioCatch >75% of investment scams caught alerting on 0.8% of sessions; KT 90.3% accuracy; Starling 300% more cancellations.",demo:"The Pune digital-arrest scenario above. The finale is in Singapore, so prepare a Singapore variant (71-year-old, government-official impersonation, 24-hour hold triggered by the 50% rule).",data:"Synthetic transactions (PaySim / AMLSim with injected patterns), scripted coached vs genuine dialogues built from real cover stories, HF scam-dialogue datasets.",stack:"gemini-3.8-live (Agent Platform supports Hindi, Marathi, Tamil, Telugu, Bengali, Japanese, Korean, Indonesian, Thai, Vietnamese), ADK 2.x on Cloud Run, Pub/Sub (hold events), BigQuery (evidence + typology library), Firestore, Model Armor",risk:"Don't claim the agent 'de-hypnotises' everyone; deeply entrenched victims needed police in person. Its job is to triage fast and escalate early with evidence. Avoid voice-stress or emotion detection (high-risk under the EU AI Act).",notes:["No public SBI or HDFC 'are you being asked to transfer?' prompt was found; SBI's page is static guidance.","Westpac SaferPay is a questionnaire, not a 24-48 hour hold.","'Regulators require pauses' is only partly true: India's 1-hour lag is a proposal, Singapore's 24-hour hold is industry-led, Australia's codes start Mar 2027, Korea's no-fault rule is a bill."]},{id:"recover",rank:2,title:"Scam-victim recovery and dispute agent",oneLiner:"After a scam, victims must assemble evidence and file with several agencies fast, and almost nobody helps them do it.",verdict:"Real and starkly quantified, but the bottleneck is institutional: an agent can speed up reporting and paperwork, not courts or first-come-first-served payouts. Best built as the 'hold failed' tail of the coercion check.",today:[{label:"1. Realisation",detail:"Days to weeks after the transfers."},{label:"2. Reporting",detail:"1930 or NCRP: lines busy, 2-3 tries; 5-6 minute waits in Telangana; Karnataka seniors 'unable to reach the Helpline in time'.",broken:!0},{label:"3. Parallel filings",detail:"Bank, NCRP, police FIR, Chakshu, NPCI. Until 2027 zero-liability doesn't cover authorised transfers; one RBI Ombudsman complaint was closed because the victim 'herself carried out the said transactions'.",broken:!0},{label:"4. Hold on mule accounts",detail:"Rs 7,647 cr of Rs 52,969 cr reported (14.4%) was put on hold, Apr 2021 - Nov 2025."},{label:"5. Restoration paperwork",detail:"NCRP acknowledgement, OTP, PAN, court order, indemnity bond; 15 days for the account holder, SP/DCP approval, 15 days for the bank, pro-rata sharing.",broken:!0},{label:"6. Outcome",detail:"Only Rs 167 cr restored: 2.18% of the amount held, about 0.3% of reported losses. Korea refunds 26.3%; Australian banks reimbursed 4%."}],voices:[{quote:"All I got from PNB was Rs 20.",who:"Digital-arrest victim (Indian Express)",url:"https://indianexpress.com/article/express-exclusive/little-or-zero-recovery-why-money-lost-in-a-digital-scam-falls-down-a-black-hole-10100678/"},{quote:"There are 4-5 stages involved, which include hiring a lawyer, proving your credentials, and in the end getting a guarantee.",who:"Victim (Indian Express)",url:"https://indianexpress.com/article/express-exclusive/little-or-zero-recovery-why-money-lost-in-a-digital-scam-falls-down-a-black-hole-10100678/"}],notes:["Correction: the '22-26% recovery rate' is Korea's voice-phishing refund rate (22.2% in 2024, 26.3% in 2025). India's comparable figure is about 0.3% of reported losses."],stepIn:"At steps 3-4. The victim uploads screenshots, recordings and statements; Gemini and Document AI build a timestamped evidence timeline, file within the golden hour, draft complaints per regime, and check the bank's duties.",whyMissed:"Every incumbent is prevention-focused. AFCA's new receiving-bank jurisdiction and Korea's liability split create multi-party disputes nobody is tooling.",demo:"Victim drops a WhatsApp export and bank statement; the agent produces the timeline and a pre-filled NCRP / AFCA complaint.",data:"Synthetic chats and statements; regulator documents (MAS SRF, SPF Act, BSP Circular 1215) for grounding.",stack:"Gemini multimodal, Document AI, ADK, Firestore / Cloud SQL, Cloud Run",risk:"Filing portals have no public APIs, so submission is simulated."},{id:"mule",rank:3,title:"Mule-network investigation copilot for small institutions",oneLiner:"Co-op banks, small finance banks and NBFCs are outside the national mule tools and investigate by hand.",today:[{label:"Rules-based alerts",detail:"Small institutions run simple threshold rules."},{label:"Not on shared platforms",detail:"MuleHunter covers 23 banks; DPIP 8. Google AML AI is monthly batch and needs history."},{label:"Manual tracing and STR writing",detail:"Analysts trace account hops by hand and write suspicious-transaction narratives; proving typology coverage is hard.",broken:!0}],stepIn:"Load transactions into BigQuery, compute graph features (hops, fan-in/out, velocity), and have Gemini write a typology-cited investigation narrative and draft STR with a human-review UI.",whyMissed:"Shared tools score accounts but do not investigate or explain; RBI's FREE-AI framework demands explainability.",demo:"AMLSim graph with injected mule ring; the copilot explains the ring and drafts the STR.",data:"IBM AMLSim, IBM AML (HI/LI), SAML-D",stack:"BigQuery (graph features), Gemini, ADK, Cloud Run",risk:"Close to the overdone 'PaySim GNN + Gemini report' pattern and to Google's own graph codelab. BigQuery Graph now needs a paid Enterprise reservation; fall back to graph features in Python on Cloud Run."},{id:"austrac",rank:4,title:"AUSTRAC Tranche 2 compliance agent for small firms",oneLiner:"Australian real-estate agents, accountants and lawyers became AML reporting entities on 1 Jul 2026 with no compliance staff.",today:[{label:"New obligations",detail:"Risk assessment, customer due diligence, beneficial ownership, sanctions/PEP screening, suspicious matter report within 3 business days."},{label:"No tooling for small firms",detail:"RegTech vendors serve banks; AUSTRAC offers starter templates only.",broken:!0},{label:"Enforcement started",detail:"AUSTRAC began issuing notices to unenrolled firms on 28 Aug 2026."}],stepIn:"Build the risk assessment, extract beneficial owners from uploaded documents, screen with Search grounding, and draft the suspicious matter report.",whyMissed:"Market built for banks; the new entities are tiny.",demo:"A sole-practitioner conveyancer onboards a trust client end to end.",data:"Synthetic IDs and trust deeds; AUSTRAC guidance documents",stack:"Document AI, Gemini with Search grounding, ADK, Cloud Run",risk:"Australia-only story; judges are JAPAC-wide."},{id:"health",rank:5,title:"Health-insurance 'grey zone' claim reviewer",oneLiner:"Mid-ticket hospital claims with upcoding, unbundling or padded stays slip through manual review.",verdict:"Real but crowded (Vitraya, Zealthix, Medi Assist, Google's own ADK sample) and hard to demo. FY25: 3.26 crore claims, 8% rejected (Rs 11,412 cr); IRDAI doesn't collect rejection reasons.",today:[{label:"Hospital submits claim",detail:"Discharge summary plus itemized bill."},{label:"Manual medical scrutiny",detail:"TPA doctors review under time pressure, especially for cashless claims."},{label:"Grey-zone leakage",detail:"8% of claims are grey zone; Rs 50k-2.5L claims leak the most. Tools target outright fraud.",broken:!0},{label:"Disputes",detail:"Denials without clause citations lead to disputes."}],stepIn:"Cross-check discharge summary, bill, policy wording and treatment guidelines; flag issues with clause citations and draft a query letter rather than a denial.",whyMissed:"Shift serves large insurers; Medi Assist's tool is in-house only.",demo:"One padded claim and one clean claim; show the cited query letter.",data:"Synthetic claim packs; Kaggle health-claim datasets",stack:"Document AI, Gemini long context, BigQuery (provider patterns), Cloud Run",risk:"Looks like document RAG unless provider-level analytics are strong."},{id:"msme",rank:6,title:"Borrower-side MSME credit-readiness agent",oneLiner:"Small business owners never see how lenders read their messy records, or why they were declined.",today:[{label:"Owner applies",detail:"Bank PDFs, GST returns, invoices, sometimes handwritten ledgers."},{label:"Lender analyses",detail:"Perfios-style tools score cash flows; Account Aggregator GST data lacks purchase-side information."},{label:"No feedback to borrower",detail:"Owner is declined without explanation and can't fix the records.",broken:!0}],stepIn:"Voice-first, vernacular agent reconciles documents, explains how a lender will read them, lists fixes and packages a submission for the AA / OCEN rails.",whyMissed:"Every analytics tool faces the lender, not the borrower. Gap is Rs 30 lakh cr.",demo:"Upload a messy statement and a ledger photo; get a readiness report in Hindi.",data:"Home Credit, synthetic statements, CORD / SROIE receipts",stack:"Document AI, Gemini, BigQuery, Cloud Run",risk:"'AI for MSME loans' is a common pitch."},{id:"vkyc",rank:7,title:"Second-line auditor for video-KYC sessions",oneLiner:"Recorded video-KYC sessions are audited by sampling while deepfake injection attacks rise.",today:[{label:"Session recorded",detail:"Vendor runs liveness and document checks at onboarding."},{label:"Sampled manual audit",detail:"Second-line teams review a fraction of sessions by hand.",broken:!0}],stepIn:"Gemini reviews recordings for script compliance, answer-document consistency, and replay or injection tells, flagging sessions for re-check.",whyMissed:"Vendors focus on detection at onboarding, not audit.",demo:"Three recorded sessions, one with inconsistencies.",data:"No public video-KYC data; scripted recordings",stack:"Gemini video understanding, BigQuery, Cloud Run",risk:"Do not claim Gemini is a deepfake detector."}],datasets:[{use:"Mobile money / UPI-style transactions",name:"PaySim",url:"https://www.kaggle.com/datasets/ealaxi/paysim1"},{use:"Card / e-commerce fraud",name:"IEEE-CIS Fraud Detection",url:"https://www.kaggle.com/c/ieee-fraud-detection"},{use:"Card fraud (PCA features)",name:"ULB Credit Card Fraud",url:"https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud"},{use:"Account-opening fraud",name:"Feedzai BAF (NeurIPS 2022)",url:"https://www.kaggle.com/datasets/sgpjesus/bank-account-fraud-dataset-neurips-2022"},{use:"AML with laundering labels",name:"IBM AML (HI/LI)",url:"https://www.kaggle.com/datasets/ealtman2019/ibm-transactions-for-anti-money-laundering-aml"},{use:"AML, 28 typologies",name:"SAML-D",url:"https://www.kaggle.com/datasets/berkanoztas/synthetic-transaction-monitoring-dataset-aml"},{use:"Generate your own mule graphs",name:"IBM AMLSim",url:"https://github.com/IBM/AMLSim"},{use:"Vehicle insurance claims",name:"Vehicle Claim Fraud",url:"https://www.kaggle.com/datasets/shivamb/vehicle-claim-fraud-detection"},{use:"Indian health claims (check quality)",name:"ClaimCourt",url:"https://www.kaggle.com/datasets/aniketaslaliya30/adaption-india-health-claim-fraud-audit"},{use:"Provider fraud (US Medicare)",name:"Healthcare Provider Fraud",url:"https://www.kaggle.com/datasets/rohitrox/healthcare-provider-fraud-detection-analysis"},{use:"Scam call dialogues (synthetic)",name:"scam-dialogue",url:"https://huggingface.co/datasets/BothBosu/scam-dialogue"},{use:"Multi-agent scam conversations",name:"multi-agent-scam-conversation",url:"https://huggingface.co/datasets/BothBosu/multi-agent-scam-conversation"},{use:"Scam call audio + text (Chinese)",name:"TeleAntiFraud",url:"https://huggingface.co/datasets/JimmyMa99/TeleAntiFraud"},{use:"Real scam call transcripts (English)",name:"YouTube Scam Transcripts",url:"https://www.kaggle.com/datasets/rivalcults/youtube-scam-phone-call-transcripts"},{use:"Thin-file credit risk",name:"Home Credit Default Risk",url:"https://www.kaggle.com/c/home-credit-default-risk"},{use:"Receipts and invoices",name:"CORD",url:"https://github.com/clovaai/cord",note:"Also SROIE and FUNSD"}],verdictTable:{gaps:["Coercion check at hold","Recovery file","Grey-zone claims"],rows:[{criterion:"Clarity of gap",scores:[5,4,3]},{criterion:"Evidence strength",scores:[5,5,4]},{criterion:"Demo drama",scores:[5,3,2]},{criterion:"11-day build feasibility",scores:[4,4,3]},{criterion:"Regulatory tailwind",scores:[5,4,3]},{criterion:"Low competition risk",scores:[3,4,2]}],caption:"1 = weak, 5 = strong. My translation of the step-by-step research verdicts (Oct 7, 2026) into scores. Recommendation: build the coercion check for JAPAC with a thin recovery tail, so the same record becomes the victim's NCRP / bank complaint pack if the money still leaves."},verifyNext:["Test gemini-3.8-live in Marathi, Hindi, Japanese and Korean on day 1 (Agent Platform lists them; quality is unverified)","Pick the demo market mix: India (Pune digital arrest) for the video, plus a Singapore variant for the finale","Write the 240-dialogue evaluation set early; it is the hard number judges reward"]},xv={key:"mfg",label:"Manufacturing",headline:"Big vendors are pulling point products, and the real pain in JAPAC factories is people: veterans retiring, novices who speak different languages, and micro factories with no sensors or data.",context:{title:"Two things the judges will know",body:"AWS Lookout for Equipment reaches end of support on Oct 7, 2026 and Microsoft deprecated Factory Operations Agent in May 2025: point products are being replaced by general multimodal models plus agents. Google publishes its own 'Technician Assistant Agent' reference (ADK + Live API + SOPs), so a plain voice copilot over manuals will look like a re-skin of their sample."},stats:[{region:"Global",fact:"Fortune Global 500 firms lose about $1.4T a year (11% of revenue) to unplanned downtime, up from $864B in 2019-20. Automotive downtime costs $2.3M per hour.",src:[["Siemens TCoD 2024","https://assets.new.siemens.com/siemens/assets/api/uuid:1b43afb5-2d07-47f7-9eb7-893fe7d0bc59/tcod-2024_original.pdf"]]},{region:"Japan",fact:"Manufacturing workforce fell from 10.55M (2023) to 10.33M (2025). SME manufacturing labour-shortage index -19.6 in Q1 2026.",src:[["MHLW 2026","https://www.mhlw.go.jp/stf/houdou/newpage_00229.html"]]},{region:"Japan",fact:"Over 80% of firms worry about future skills transfer; 63% cite retiring experts. Only about a third say transfer is going well. Top remedy is re-hiring seniors (54.8%); only 31.2% digitize tacit skills.",src:[["JILPT May 2026","https://www.jil.go.jp/press/documents/20260527.pdf"]]},{region:"Japan",fact:"About 20% of maintenance staff are 60+, half are 50+, and over 40% say skills transfer takes more than 5 years.",src:[["Yachiyo Solutions 2025","https://yachiyo-sol.com/20250121-2/"]]},{region:"Japan",fact:"2.57M foreign workers (Oct 2025), about a quarter in manufacturing; Vietnamese are the largest group (23.6%). The intern programme becomes Ikusei Shuro from April 2027.",src:[["Japan Times","https://www.japantimes.co.jp/news/2026/01/30/japan/foreign-workers-record-high/"],["IOM","https://asiapacific.iom.int/sites/g/files/tmzbdl671/files/documents/2025-10/japan_labour-migration_profile_october-2025-1.pdf"]]},{region:"India",fact:"MSMEs are about 35.4% of manufacturing output, 48.6% of exports and 31.1% of GDP; over 98% of registered firms are micro.",src:[["PIB Economic Survey","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2219984"],["ICRIER 2025","https://icrier.org/pdf/Annual-Survey-MSMEs_India_2025.pdf"]]},{region:"India",fact:"Low-adoption machinery firms: 63% lack in-house digital skills, 41% have budget constraints, 33% have legacy or integration problems.",src:[["Siemens India benchmark 2025","https://assets.ctfassets.net/17si5cpawjzf/1gYxRV4hah38ZebwgGgzW7/d1a16cca9af91b7a538c70d0ff19a5c4/siemens-benchmark-2025.pdf"]]},{region:"India",fact:"6.68 lakh MSMEs are ZED certified (government quality scheme with 80% subsidy for micro firms), a channel for quality tools.",src:[["PIB 2026","https://www.pib.gov.in/PressReleasePage.aspx?lang=2&PRID=2278107&reg=48"]]},{region:"Global",fact:"Median scrap-and-rework cost is 5.0% of cost of goods sold; 27.4% of firms don't know their cost of poor quality.",src:[["APQC","https://www.apqc.org/what-we-do/benchmarking/open-standards-benchmarking/measures/scrap-and-rework-costs-percentage-0"],["Emerald IJQRM","https://www.emerald.com/ijqrm/article/43/5/1249/1347168/Revisiting-cost-of-poor-quality-in-the-digital-era"]]},{region:"EU / India",fact:"CBAM's definitive regime started Jan 1, 2026. Without verified plant data, importers use default values with a 10% (2026), 20% (2027), 30% (2028+) markup. Iron and steel are ~90% of India's CBAM-exposed exports.",src:[["EU TAXUD","https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism_en"],["ORF","https://www.orfonline.org/expert-speak/the-eu-cbam-seen-from-new-delhi-and-seen-from-brussels"]]},{region:"India",fact:"Energy is 15-20% of production cost in forging and foundry clusters; a Kolhapur foundry pilot found 9-45% energy savings from simple measures.",src:[["BEE","https://bee-drupal.shermanindia.com/sites/default/files/Forging_Sector_Energy_Mapping_Report.pdf"],["Asar 2025","https://asar.co.in/report/forging-a-greener-future-together-decarbonising-kolhapurs-foundries-one-step-at-a-time/"]]},{region:"Japan",fact:"About 80% of 400 Japanese manufacturers call rare-earth procurement a management challenge or critical risk after China's Jan 2026 curbs.",src:[["Kyodo Aug 2026","https://english.kyodonews.net/articles/-/81400"]]},{region:"SE Asia",fact:"Manufacturing attrition 17.5% (2025). In Vietnamese electronics plants about half of workers had been with their employer under 6 months.",src:[["Aon","https://www.aon.com/apac/in-the-press/asia-newsroom/2025/aon-survey-projects-moderate-salary-growth-of-5-3-percent-for-southeast-asia-in-2026"],["IOM Vietnam","https://vietnam.iom.int/sites/g/files/tmzbdl1396/files/documents/2025-07/case-study-of-recruitment-employment-and-well-being-of-internal-migrant-workers-in-viet-nams-electronics-sector.pdf"]]},{region:"Australia",fact:"Mining has a 63% skills shortage and engineering enrolment is down over 60% in 10 years, while 550+ autonomous trucks shift work to diagnostics.",src:[["AUSMASA","https://ausmasa.org.au/news-and-events/mining-research-bulletin-september-2025/"]]},{region:"China",fact:"MIIT 'AI + Manufacturing' plan targets 1,000 industrial AI agents and 500 scenarios by 2027, with compute vouchers for SMEs.",src:[["CSET translation","https://cset.georgetown.edu/wp-content/uploads/t0667_ai_manufacturing_opinions_EN.pdf"]]}],statCaveats:["METI's '2025 Cliff' is about legacy IT debt, not skilled workers. Pitch 'skills transfer', not 'companies with no successor' (successor absence is at a record low).","The '15-40% of revenue' cost-of-poor-quality figure is a practitioner heuristic.","Google Visual Inspection AI appears unavailable since Oct 2025 per forum reports; no official notice found.","Gemini accuracy on raw machine audio and on fine assembly verification at 1 fps is unproven; prototype those first."],incumbents:[{name:"Siemens Industrial Copilot",category:"Ops / maintenance copilot",does:"Natural-language PLC code, shop-floor fault guidance, Senseye predictive maintenance; can run on-prem.",gap:"Quote-only, months-long sales cycles, tied to Siemens hardware, out of reach for MSMEs."},{name:"Google MDE + Manufacturing Connect (Litmus)",category:"OT data platform + agents",does:"Connects OT to BigQuery and Vertex AI; GE Appliances runs 800+ agents, Tata Steel 300+.",gap:"Assumes PLCs, historians and a system integrator. Nothing ready for a 15-person shop."},{name:"AWS Lookout for Equipment / Monitron",category:"Predictive maintenance",does:"Multivariate anomaly detection; sensor kit.",gap:"Discontinued (end of support Oct 7, 2026) / closed to new customers."},{name:"Microsoft Factory Operations Agent",category:"Ops copilot",does:"Natural-language Q&A over IT/OT data.",gap:"Deprecated May 2025; replacement needs Fabric capacity."},{name:"Augury",category:"Sensor-based predictive maintenance",does:"Vibration, temperature and ultrasonic sensors plus AI diagnosis.",gap:"Forrester modelled $4.8M licences over 3 years plus $815K implementation. Proprietary hardware."},{name:"Uptake / Avathon",category:"Asset performance management",does:"Heavy-asset predictive analytics.",gap:"Estimated $350K-750K a year (competitor's estimate)."},{name:"Infinite Uptime / Nanoprecise",category:"Predictive maintenance (India / global)",does:"Proprietary sensors plus AI for steel, cement, mining.",gap:"Sensor-dependent; built for large heavy industry."},{name:"Ripik.ai / Detect Technologies",category:"Industrial vision (India)",does:"Kiln vision, smelter hotspots, CCTV-based safety and inspection.",gap:"Bespoke per use case for large process plants or HSE."},{name:"Jidoka / LandingLens / Instrumental",category:"Visual QC",does:"Trained or no-code defect detection, fixed stations.",gap:"Needs labelled defects or fixed stations per SKU; hard for high-mix shops."},{name:"Retrocausal",category:"Assembly guidance",does:"Webcam tracks manual assembly steps.",gap:"Per-station setup, US/EU focus; guides the procedure but doesn't capture where it came from."},{name:"Cognite Atlas AI",category:"Industrial data + agents",does:"Low-code agents on Cognite Data Fusion.",gap:"Requires the full platform; oil, gas and process majors."},{name:"Tulip",category:"Frontline operations",does:"No-code apps, Frontline Copilot.",gap:"From ~$1,200/month per interface; someone must build the apps."},{name:"MaintainX / UpKeep / Fiix",category:"Maintenance software + AI",does:"Manual Q&A, voice work orders, SOP translation.",gap:"Value only once data lives in their system; text-first and reactive."},{name:"Augmentir / Poka / Dozuki",category:"Connected worker",does:"Video to SOP, translation, photo step-verification (Augmentir).",gap:"Records what the expert does, not why. No active interviewing. Western enterprise pricing."},{name:"tebiki (Japan)",category:"Video SOPs",does:"Phone video to subtitles, 100+ language translation, AI voice-over.",gap:"Strongest direct competitor for Japanese skills transfer, but passive capture and translation only; no live verification of novices."}],overdone:[{pattern:"Sensor dashboard plus 'Gemini explains the anomaly'",examples:[["Industrial Predictive AI","https://devpost.com/software/industrial-predictive-ai"],["FactoryEye","https://devpost.com/software/factoryeye"],["MachInsight AI","https://devpost.com/software/machine-sensing-and-monitoring-ai-agent"]]},{pattern:"Remaining-useful-life prediction on NASA CMAPSS",examples:[["Typical repo","https://github.com/JeremyMaille/rul-prediction-cmapss"]]},{pattern:"Defect classifier on MVTec AD or VisA (benchmarks saturated)",examples:[["MVTec AD 2 paper","https://arxiv.org/abs/2503.21622"]]},{pattern:"Multi-agent plant optimizer with a supervisor agent (won Gen AI Exchange 2025, JK Cement track)",examples:[["Gen AI Exchange finale","https://blog.hack2skill.com/gen-ai-exchange-hackathon-finale"]]},{pattern:"'Chat with your manuals' copilot (Google ships the reference)",examples:[["Google Technician Assistant","https://googlecloudplatform.github.io/cloud-solutions/manufacturing/tech-assistant/"]]}],overdoneNote:"None of the sensor-dashboard projects won the ADK Hackathon. The same organizer (Hack2skill) runs this Cup, so judges have seen the supervisor-agent plant optimizer.",gaps:[{id:"kotsu",rank:1,title:"Kotsu Capture: clip-anchored expert interview + novice-failure loop",oneLiner:"Veterans know by sound and feel when a job is right. Today's tools film what they do and translate it, but the 'why' (what to listen for, when to stop) is never captured, and nobody notices what novices get wrong until defects appear.",verdict:"Real and well evidenced, but crowded as a category in Japan (tebiki, Emuni with Google Cloud, Chubu's AI Manual Coach, NTT DATA, Squint, Augmentir). Only two mechanics look unclaimed: an interview played over clips of the expert's own video, and novice mistakes automatically turned into new questions for the expert.",today:[{label:"1. The veteran holds the know-how",detail:"A 60+ operator knows by sound, feel or smell when a weld, die or press is right. ~20% of maintenance staff are 60+; over 80% of firms worry about skills transfer and 63% cite retiring experts (JILPT, May 2026)."},{label:"2. Learning by watching ('\u898B\u3066\u899A\u3048\u308D')",detail:"On-the-job shadowing is the default: a new-graduate technician takes 5.2 years on average to become 'ichininmae' (proficient). 95% of firms run OJT, but 46% say its content or results are unclear (MHLW).",broken:!0},{label:"3. No time or trainers",detail:"Over 60% of manufacturing sites say they lack people to teach (Monozukuri White Paper 2025). The top remedy is re-hiring retirees (54.8%)."},{label:"4. Manuals and video SOPs",detail:"Paper work standards or video tools (tebiki, Kaminashi) record the steps and translate them. Only 31.2% of firms digitize tacit skills; small firms lag because know-how 'can't be put into words'."},{label:"5. The 'why' is lost",detail:"Research on expert knowledge (Klein's Critical Decision Method) shows tacit, perceptual cues resist articulation and don't appear in SOPs; unstructured interviews miss them. Experts adapting to digital tools is itself a barrier (38.2%).",broken:!0},{label:"6. Novices from abroad",detail:"2.57M foreign workers (2025), a quarter in manufacturing. Their injury rate is 2.8 per 1,000 vs 2.3 for all workers; technical intern trainees 4.1. Manufacturing is ~48% of foreign-worker injuries."},{label:"7. Mistakes surface late",detail:"Errors show up as defects or accidents, not during the task; nobody feeds them back to the expert.",broken:!0}],lists:[{title:"Why now",items:["Japan's 14th Labour Accident Prevention Plan targets foreign workers' injury rate at or below the all-worker average by 2027.","Ikusei Shuro (from 1 Apr 2027) requires a certified 3-year training plan per foreign worker with skill targets (basic skill test after year 1, grade-3 test at year 3) and Japanese targets (A1 on entry, A2 by year 3), plus assigned trainers.","JILPT 2026: firms' barriers to digital skills transfer are lack of digital talent (64.2%), know-how (49.3%), cost (46.8%) and time (41.7%), so the tool must work by voice for veterans who won't type."]}],extraTables:[{title:"What the agent does at each broken step",headers:["Step","Agent action","Output"],rows:[["Capture (step 5)","Gemini segments the expert's phone video and flags judgment moments: pauses, re-checks, listening posture, tool swaps, speed changes","Timeline of candidate judgment moments"],["Interview (step 5)","Replays each 5-second clip inside a Gemini Live session and asks a reflective, Critical-Decision-Method-style question ('At 1:42 you paused, what were you listening for? What would have made you stop?')","Cue - decision - action - reason records pinned to timestamps, plus the reference audio of 'the hiss you listen for'"],["Publish (step 4)","Builds the SOP with the captured 'why' and translates it (JA to VI / ID, HI to TA)","Multilingual SOP with embedded clips"],["Verify (step 7)","Novice films the task; a separate checker model compares it against the expert procedure (offline on short clips)","Skipped / out-of-order steps flagged"],["Close the loop (step 7)","Clusters novice mistakes and sends them back to the expert as new questions; publishes SOP v2 with a visible diff","Transferability score per step, which feeds the Ikusei Shuro training plan"]]}],stepIn:"At steps 5 and 7. Users: the veteran (voice only), the novice, and the line supervisor who signs off training; payer: plant manager or HR, now pushed by Ikusei Shuro training-plan duties and the 2027 injury-rate target.",whyMissed:"Competitors either interview from documents or topics (Emuni, NTT DATA, LIGHTz) or have the expert narrate while working (Konica Minolta's PoC found experts said 195% more that way, Kaminashi). Novice-vs-expert comparison exists (Chubu, NEC, DeepHow), but none sends the differences back to the expert as questions.",persona:"Sato-san, 63, press-die setter at a 40-person stamping shop in Aichi; Nguyen, 24, a Vietnamese technical intern starting on the same press.",script:[{t:"0-15 s",line:"Hook: 'Sato-san retires in March. He knows a die is set right by the sound. Nguyen has the manual, and it doesn't say that.'"},{t:"15-40 s",line:"Sato-san films the die change on his phone. Gemini marks four judgment moments on the timeline."},{t:"40-65 s",line:"The clip at 1:42 replays; the agent asks in Japanese 'You paused and tapped the bolster. What were you listening for?' His answer becomes a rule with the reference sound attached."},{t:"65-80 s",line:"The SOP appears in Vietnamese with the clip and sound. Nguyen's attempt is checked: step 6 skipped, flagged."},{t:"80-90 s",line:"Nguyen's mistake becomes a new question for Sato-san; SOP v2 shows the diff. Close with the transferability score."}],credibility:"Prototype the risky parts first: Gemini Live video sessions drop after ~2 minutes without context compression, and Gemini tends to confirm the step it expects rather than what it sees, so use a separate model as an independent checker. Live API video is at most 1 frame per second, so do fine-grained verification offline on short clips.",demo:"The Aichi stamping-shop scenario above, using your own phone videos plus IndustReal / Assembly101 clips with labelled mistakes for the verify step.",data:"IndustReal and Assembly101 (assembly video with labelled mistakes), MaintNorm / MaintIE, your own phone videos",stack:"Gemini video understanding (gemini-3.8-flash), gemini-3.8-live for the interview, ADK multi-agent, BigQuery (knowledge records), Cloud Storage, Cloud Run",risk:"Japanese judges will know the competitors; name Emuni and AI Manual Coach in the deck and show the two columns only you cover. Don't lead with translation; it's table stakes."},{id:"phone",rank:2,title:"Phone-as-sensor machine triage for MSMEs",oneLiner:"Micro factories have no sensors or PLCs, so machines run until they break.",verdict:"No Google hackathon winner, but crowded among entrants (SonicFix, MachMind AI) and early products (Sensorry). Only worth it as triage with a per-machine baseline, not 'LLM diagnoses from sound'.",today:[{label:"No instrumentation",detail:"98% of registered MSMEs are micro; no sensors, PLC or maintenance software."},{label:"Operator hears a problem",detail:"A strange noise or gauge reading; a local mechanic is called."},{label:"Predictive maintenance needs hardware",detail:"Augury, Infinite Uptime and Nanoprecise need proprietary sensors; nothing records the machine's normal baseline.",broken:!0},{label:"Breakdown and downtime",detail:"Run-to-failure, unplanned stoppage."}],stepIn:"Operator records 10 s of sound, photographs the gauge or HMI and leaves a voice note. Gemini reads values, compares sound with the machine's own baseline and replies in the local language.",whyMissed:"All incumbents sell sensors and subscriptions to large plants.",demo:"Normal vs faulty pump sound plus a gauge photo; a Hindi diagnosis and next action.",data:"MIMII, DCASE 2025 Task 2, gauge photos",stack:"Gemini multimodal (audio + image), BigQuery, Cloud Run",risk:"Gemini raw-audio anomaly detection is unproven; pair with an embedding-distance baseline."},{id:"cbam",rank:3,title:"CBAM carbon data pack for small exporters",oneLiner:"EU buyers now need embedded-emissions data that small Indian suppliers only have on paper.",verdict:"Real, but Indian products already do it (CarbonSettle takes handwritten logs, photos and WhatsApp voice notes and produces the EU filing). Overlaps with Sustainability-theme carbon entries.",today:[{label:"EU importer asks for data",detail:"Definitive CBAM since Jan 1, 2026; first declaration due Sep 30, 2027."},{label:"Data lives on paper",detail:"Electricity bills, coke and furnace logs, handwritten production registers."},{label:"Consultants or defaults",detail:"Without verified data, importers use default values plus a 10% to 30% markup, and suppliers lose orders.",broken:!0}],stepIn:"Gemini extracts activity data from photos and PDFs, BigQuery computes emissions per product under the CBAM method, and an agent drafts the supplier communication and shows the penalty avoided.",whyMissed:"Carbon platforms assume ERPs and metering.",demo:"Upload a month of bills and logs; get a per-product emissions pack.",data:"Synthetic plant records; EU CBAM default values",stack:"Gemini, Document AI, BigQuery, Cloud Run",risk:"Overlaps with Sustainability. CBAM SaaS vendors not surveyed yet."},{id:"mlog",rank:4,title:"Maintenance-log intelligence (failure knowledge graph)",oneLiner:"Technicians' shorthand notes are unsearchable, so the same failure is diagnosed from scratch.",today:[{label:"Shorthand notes",detail:"e.g. 'repl hyd pmp seal lkg' in maintenance software or on paper."},{label:"Knowledge leaves with people",detail:"No way to ask 'what fixed this last time?'",broken:!0}],stepIn:"Gemini normalizes notes, extracts asset, failure mode and fix into a BigQuery graph; an ADK agent answers root-cause questions.",whyMissed:"Maintenance-software AI only works on clean data inside their own system.",demo:"Ask why a haul truck keeps failing; the agent cites past fixes.",data:"MaintNorm, MaintIE (Australian mining work orders)",stack:"Gemini, BigQuery, ADK, Cloud Run",risk:"Less visual on its own; pairs well with Kotsu Capture as the memory layer."},{id:"supply",rank:5,title:"Tier-2/3 supplier disruption copilot",oneLiner:"Small suppliers learn about export controls and shortages weeks after big firms.",today:[{label:"News breaks",detail:"Rare-earth curbs, shipping disruptions."},{label:"No mapping to the BOM",detail:"Small suppliers can't see which parts are exposed; enterprise tools are expensive.",broken:!0}],stepIn:"Search-grounded Gemini maps news to a BOM extracted from spreadsheets, BigQuery computes inventory runway, and an agent drafts RFQs.",whyMissed:"Resilire, Everstream and Interos serve enterprises.",demo:"A rare-earth headline mapped to affected parts and runway.",data:"Synthetic BOM and inventory",stack:"Gemini with Search grounding, BigQuery, ADK, Cloud Run",risk:"Synthetic data weakens the operational-data story."},{id:"inspect",rank:6,title:"Zero-training inspection assistant",oneLiner:"High-mix, low-volume shops can't justify training a vision model per part.",today:[{label:"Manual inspection",detail:"Inspectors check parts by eye against a spec."},{label:"Vision tools need labels",detail:"LandingLens, Jidoka and Instrumental need labelled defects or fixed stations per SKU.",broken:!0}],stepIn:"Golden sample photo plus written spec; Gemini inspects handheld photos and explains the defect.",whyMissed:"Incumbents optimize for high volume.",demo:"Burr above spec flagged with explanation.",data:"MVTec AD 2, VisA, Real-IAD Variety",stack:"Gemini multimodal, BigQuery, Cloud Run",risk:"Most overused datasets; zero-shot loses to specialist models on pixel accuracy."}],datasets:[{use:"Egocentric assembly video with errors",name:"IndustReal",url:"https://timschoonbeek.github.io/industreal",note:"Best fit for Kotsu Capture"},{use:"Multi-view assembly with mistake labels",name:"Assembly101",url:"https://assembly-101.github.io/"},{use:"Mining work-order text",name:"MaintIE",url:"https://github.com/nlp-tlp/maintie",note:"MIT licence"},{use:"Work-order normalization",name:"MaintNorm",url:"https://research-repository.uwa.edu.au/en/publications/maintnorm-a-corpus-and-benchmark-model-for-lexical-normalisation-/"},{use:"Machine sound (pumps, valves, fans)",name:"MIMII",url:"https://zenodo.org/records/3384388"},{use:"Anomalous sound, first-shot",name:"DCASE 2025 Task 2",url:"https://zenodo.org/records/15097779"},{use:"Visual anomaly (harder)",name:"MVTec AD 2",url:"https://www.mvtec.com/research-teaching/datasets/mvtec-ad-2",note:"CC BY-NC-SA"},{use:"199K images, 160 categories",name:"Real-IAD Variety",url:"https://realiad4ad.github.io/Real-IAD-Variety/"},{use:"Bearing vibration faults",name:"CWRU Bearing",url:"https://engineering.case.edu/bearingdatacenter/download-data-file"},{use:"Remaining useful life (simulated, overused)",name:"NASA CMAPSS",url:"https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip"},{use:"Bearing run-to-failure",name:"IMS Bearings",url:"https://phm-datasets.s3.amazonaws.com/NASA/4.+Bearings.zip"},{use:"Semiconductor pass/fail",name:"SECOM",note:"UCI, link not verified"},{use:"Line measurements to failure",name:"Bosch Production Line",note:"Kaggle, link not verified"}],verdictTable:{gaps:["Kotsu Capture","Phone-as-sensor","CBAM data pack"],rows:[{criterion:"Clarity of gap",scores:[5,4,4]},{criterion:"Evidence strength",scores:[5,3,4]},{criterion:"Demo drama",scores:[4,4,2]},{criterion:"11-day build feasibility",scores:[3,4,4]},{criterion:"JAPAC breadth",scores:[4,3,2]},{criterion:"Low competition risk",scores:[2,2,2]}],caption:"1 = weak, 5 = strong. My scoring from the first-round research, the similar-projects scan and targeted searches (Oct 7, 2026); the dedicated manufacturing journey agent stalled, so phone-as-sensor and CBAM journeys were not deepened."}},zv={key:"sus",label:"Sustainability",headline:"Governments and Google now cover farm advice, scheme FAQs and river flood forecasting. What nobody does well is the step after the alert: turning a hazard or crop loss into a filed claim, an entitlement, or a confirmed-safe person.",context:{title:"Access to arrange now",body:"The Flood Hub API has a waitlist, and the IMD API only accepts a pre-registered static IP (Cloud Run needs Cloud NAT with a static egress IP). Voice plus multilingual alone won't beat Bhashini and Sarvam; lead with Earth Engine evidence, agents that complete tasks, and a feedback loop."},stats:[{region:"India",fact:"About 30% of crop output is lost to pests and disease (government estimate). Fall armyworm cut maize yields ~45% in affected regions.",src:[["SciDev 2025","https://www.scidev.net/asia-pacific/supported-content/climate-pests-and-pollution-fuel-crop-losses-across-india/"]]},{region:"India",fact:"Small and marginal farmers are ~86% of holdings; over 60% of marginal farmers lost crops to extreme weather in the past 5 years.",src:[["iHub-AWADH 2025","https://ihub-awadh.in/wp-content/uploads/2025/03/SMALL-FARMERS-REPORT-FINAL_compressed.pdf"]]},{region:"India",fact:"PMFBY crop insurance: Rs 5,927 cr of claims pending as of 30 Jun 2026; causes include yield disputes, bank-proposal errors and delayed state subsidy.",src:[["Lok Sabha reply","https://sansad.in/getFile/lsapps/loksabhaquestions/annex/188/AU444_nR8iSD.pdf"],["Hindustan Times","https://www.hindustantimes.com/india-news/farm-insurance-claims-of-over-5k-cr-pending-101753816011834.html"]]},{region:"India",fact:"Crop insurance covers only ~27-31% of gross cropped area vs ~90% in the US and ~80% in China.",src:[["RMA India","https://rmaindia.org/risk-landscape-in-crop-insurance-in-india-emerging-challenges-and-the-way-forward/"]]},{region:"India",fact:"Localized losses must be reported within 72 hours. Parliament asked about farmers missing the window due to app glitches and poor network; the government won't extend it.",src:[["Lok Sabha AU2671","https://sansad.in/getFile/lsapps/loksabhaquestions/annex/188/AU2671_L4FgDu.pdf"]]},{region:"India",fact:"CROPIC geotagged crop photos are for insurer validation; there are no plans for a public dashboard.",src:[["PIB","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2151354&lang=2&reg=3"]]},{region:"India",fact:"IMD agromet advisories are issued twice a week at district/block level and reach only ~5.59M farmers by SMS.",src:[["PIB 2026","https://www.pib.gov.in/PressReleasePage.aspx?PRID=2242354&lang=1&reg=3"]]},{region:"APAC",fact:"Countries with weak early-warning coverage have ~6-8x higher disaster mortality; 24 hours of warning cuts damage ~30%. Fewer than 55% of weather agencies issue heat alerts.",src:[["ESCAP","https://www.unescap.org/sites/default/d8files/event-documents/B2300475_4E.pdf"]]},{region:"Philippines",fact:"Typhoon Kalmaegi (Nov 2025): 5.46M affected, 253 dead, 324,878 houses damaged.",src:[["ReliefWeb","https://reliefweb.int/disaster/TC-2025-000203-PHL"]]},{region:"Indonesia",fact:"Sumatra floods and landslides (Dec 2025): 860+ dead, 521 missing, 570k displaced.",src:[["WMO","https://wmo.int/media/news/devastating-rainfall-asia-claims-hundreds-of-lives"]]},{region:"India",fact:"Lightning killed 2,825 people in 2024 (NCRB, via secondary source). An Odisha study found the alert apps failed the last-mile rural population.",src:[["New Indian Express","https://www.newindianexpress.com/states/odisha/2025/May/26/lightning-deaths-rise-as-early-warning-apps-fail-to-serve-study"]]},{region:"India",fact:"Heat 2025: at least 84 heatstroke deaths reported vs 14 confirmed; IMD alerts are temperature-only and deaths occurred on no-alert days. ~95% of heat action plans lack a vulnerability assessment.",src:[["HeatWatch","https://www.heatwatch.in/report/heatwatchs-2025-report-reveals-undercounted-heatstroke-deaths-and-urgent-gaps-in-public-health-response/"],["CEEW","https://www.ceew.in/sites/default/files/mapping-climate-risks-and-impacts-of-extreme-heatwave-disaster-in-indian-districts.pdf"]]},{region:"Japan",fact:"2025: a record 100,510 heatstroke ambulance transports; 57.1% aged 65+, 38% happened at home.",src:[["FDMA","https://www.fdma.go.jp/disaster/heatstroke/items/r7/heatstroke_nenpou_r7.pdf"]]},{region:"Pacific",fact:"Fiji, PNG and Vanuatu: last-mile delivery incomplete and feedback mechanisms limited (IOM 2026).",src:[["IOM","https://asiapacific.iom.int/sites/g/files/tmzbdl671/files/documents/2026-04/annex-3-2026-ews-summary-techincal-report.pdf"]]},{region:"India",fact:"Less than 40% of people with disabilities have a UDID card; 11 lakh+ applications pending, 60%+ of those for 6+ months.",src:[["The Hindu","https://www.thehindu.com/data/less-than-40-of-disabled-persons-in-india-have-the-id-needed-for-benefits/article70019908.ece"]]},{region:"India",fact:"Welfare exclusion is driven mainly by document problems (Aadhaar not linked to bank, name mismatches), not lack of awareness.",src:[["Indus Action 2025","https://indusaction.org/wp-content/uploads/2025/11/Cirtizen-Experience-Of-Welfare-Access.pdf"]]},{region:"Indonesia",fact:"65.4% of 25.8 Mt of waste unmanaged in 2025; a minister's field check found only 9-10% properly managed.",src:[["ANTARA","https://jatim.antaranews.com/berita/936513/only-10-percent-of-waste-in-indonesia-managed-properly-minister"]]}],statCaveats:["PMFBY pending figures differ by date: Rs 5,405 cr (2025) vs Rs 5,927 cr (Jun 2026).","MoHUA's '80% waste processing' is capacity, not actual processing.","Gemini Live support for Indic and SEA dialects wasn't verified; test early."],incumbents:[{name:"Google Flood Hub",category:"Flood forecasting",does:"Riverine forecasts up to 7 days in 150+ countries; urban flash floods 24h ahead since Mar 2026.",gap:"Information, not action: no household guidance, two-way contact or vulnerable-person tracking."},{name:"Google Groundsource",category:"Disaster data",does:"Gemini turned news reports into 2.6M historical flood events.",gap:"Historical only; the method could power live triage."},{name:"Google ALU / AMED APIs",category:"Agriculture building blocks",does:"Field boundaries, wells, crop type, sowing and harvest dates (India GA).",gap:"B2B building blocks; Kharif accuracy ~75%; nobody links them to claims or entitlements."},{name:"WeatherNext 2",category:"Weather",does:"15-day ensemble forecasts in Earth Engine and BigQuery.",gap:"Raw data; translation into health or farm decisions is left to builders."},{name:"Bharat-VISTAAR (Feb 2026)",category:"Government voice farm AI",does:"Helpline 155261, IVR, app; weather, mandi prices, pests, info on 10 schemes.",gap:"Makes 'farmer chatbot' a government incumbent, but it informs and doesn't file claims or fix documents."},{name:"Kisan e-Mitra",category:"PM-KISAN grievance bot",does:"11 languages, ~20k queries a day.",gap:"One scheme, templated answers, not agentic."},{name:"Digital Green FarmerChat",category:"Advisory bot (RAG)",does:"14 languages, voice and image.",gap:"~25% of questions unanswered; ~9 s responses; weak image recognition."},{name:"Plantix",category:"Crop diagnosis",does:"Photo-based pest and disease diagnosis.",gap:"Distrusted on early-stage rice; confuses weather damage with disease."},{name:"Wadhwani CottonAce / NPSS",category:"Pest surveillance",does:"Trap-photo pest counts for spray advice; part of the national system.",gap:"Extension-worker tool; government already owns it."},{name:"Sachet / CAP",category:"National alerts",does:"Geo-targeted multilingual SMS, cell broadcast and app alerts.",gap:"One-way, SMS delays, no record of who acted."},{name:"Damini / Meghdoot / Mausam",category:"IMD apps",does:"Lightning and agromet advisories.",gap:"Needs a smartphone that someone is watching; poorest victims are outside."},{name:"Sarvam / Bhashini / Jugalbandi",category:"Indic voice infrastructure",does:"Bhashini: 23 voice and 36 text languages; Sarvam voice agents reached 5M users in 31 days.",gap:"Strong competitor for voice-first services; beat it with multimodal evidence plus task completion."},{name:"Google Lookout / Be My Eyes",category:"Accessibility",does:"Reads text, currency, labels.",gap:"Gemini Q&A in Lookout is English-only; no help with government processes."},{name:"Gringgo (Indonesia)",category:"Waste",does:"Waste-worker app with classification and routing.",gap:"No traceability for EPR or plastic credits."}],overdone:[{pattern:"PlantVillage disease classifiers (accuracy falls from 99% to 31% on real data)",examples:[["Background-bias paper","https://ar5iv.labs.arxiv.org/html/2206.04374"]]},{pattern:"Generic farmer advisory chatbots (weather + prices + schemes + pests)",examples:[]},{pattern:"Crop recommendation from NPK and rainfall (Kaggle exercise)",examples:[]},{pattern:"Carbon-footprint calculators, eco-challenges",examples:[]},{pattern:"Food-donation marketplaces (won Solution Challenge 2024)",examples:[["Solution Challenge 2024","https://blog.google/innovation-and-ai/technology/developers-tools/meet-the-students-that-are-changing-the-world-through-technology/"]]},{pattern:"Disaster map dashboards / 'chat with Earth Engine' (GeoGemma won 2025)",examples:[["Solution Challenge 2025","https://gulfnews.com/world/asia/pakistan/pakistani-students-win-big-at-google-solution-challenge-2025-1.500184786"]]},{pattern:"Photo-based waste classification and smart bins",examples:[]},{pattern:"SOS apps, mental-wellness chatbots, image description for blind users",examples:[["Gemini API competition winners","https://developers.googleblog.com/announcing-the-winners-of-the-gemini-api-developer-competition/"]]}],overdoneNote:"Recent winners: GeoGemma (geospatial Gemini, Solution Challenge 2025 APAC), Medicall, accessibility-heavy Gemini API competition winners (Vite Vere, Gaze Link, ViddyScribe).",gaps:[{id:"crop",rank:1,title:"PMFBY localized-loss claim copilot (72-hour report, evidence, deadlines)",oneLiner:"For localized losses (hail, inundation, landslide), PMFBY makes the farmer start the claim within 72 hours, then depends on a field survey within 10 days. When the survey is late or never comes, the farmer has nothing to prove the loss, even though the rules already accept satellite and weather evidence in disputes.",verdict:"Sharpest gap of the three sustainability options. Every existing government tool works for the insurer or the state; nothing gives the farmer an evidence pack or a deadline tracker.",today:[{label:"1. Is the loss even claimable?",detail:"Only if the state notified localized cover for that crop, peril and season, and the premium was paid before the event. Maharashtra dropped localized cover for Kharif 2025; paddy inundation was only reintroduced from Kharif 2026. Farmers can't easily tell which applies.",broken:!0},{label:"2. Report within 72 hours",detail:"Via the Crop Insurance app, helpline 14447, insurer, bank or officials, with survey number, crop, acreage, application number and account. A central study found 42% of farmers unaware of the channels; a Maharashtra evaluation found farmers 'normally report within 15 days'; app photo uploads fail; the 72 hours won't be extended.",broken:!0},{label:"3. Assessor and joint survey (rule: within 10 days)",detail:"Rajasthan, Apr 2026: 'weeks ago\u2026 no survey'. Haryana: informed on time, no team came. Ganjam, Sep 2026: 'administration has not yet reached the village'. Evidence decays before anyone arrives; Rajasthan's agriculture commissioner had to rule that 'crop not found in the field' is not a valid rejection.",broken:!0},{label:"4. Loss assessment",detail:"Farm-level survey; payout follows state-notified input cost by crop stage. In disputes, technology-based evidence (weather, remote sensing) and the survey are weighted 70:30 and binding."},{label:"5. Settlement",detail:"Due within 15 days of the survey report, with a 12% penalty for delays. Rs 5,927 cr pending on 30 Jun 2026; Andhra Pradesh has settled only 67%."},{label:"6. Dispute within 7 days",detail:"Written notice to the district committee 'with proofs/data/reports'. The farmer holds none, and can't see where the claim is pending. One Haryana case took ~4 years via a consumer commission.",broken:!0},{label:"7. Payment by bank transfer",detail:"Stalls on unverified bank accounts; small unexplained credits (Rs 1 to Rs 21 in Maharashtra, 2025) cause outrage."}],voices:[{quote:"We submitted our claim weeks ago after hailstorm damaged our harvested crop. So far, there has been no survey.",who:"Ramesh Kumar, Sikar, Apr 2026",url:"https://timesofindia.indiatimes.com/city/jaipur/govt-asks-insurance-cos-to-speed-up-crop-loss-surveys/articleshow/130219973.cms"},{quote:"I have just two acres\u2026 Rs 6 credited\u2026 not even sufficient to buy me a cup of tea.",who:"Farmer, Chhatrapati Sambhajinagar, Nov 2025",url:"https://economictimes.indiatimes.com/news/india/maharashtra-farmer-gets-rs-6-aid-for-crop-losses-says-cant-even-buy-cup-of-tea-with-it/articleshow/125108822.cms"},{quote:"I harvested nearly 90 quintals of wheat, but it has now turned black.",who:"Khajan Singh, Sri Ganganagar",url:"https://timesofindia.indiatimes.com/city/jaipur/hailstorms-batter-crops-farmers-still-await-surveys-compensation/articleshow/130179029.cms"},{quote:"No officer came to inspect the crop, so there is no question of receiving insurance.",who:"Farmer quoted by GroundReport",url:"https://www.groundreport.in/groundreport/crop-insurance-delays-farmers-left-waiting-amid-climate-challenges-8766785/"}],tools:[{tool:"Crop Insurance app",users:"Farmers",does:"Enrolment, loss reporting with photos, status",gap:"Upload failures; no visibility of where a claim is stuck"},{tool:"Helpline 14447 (KRPH)",users:"Farmers (inbound)",does:"Multilingual reporting and grievances",gap:"Reactive; collects no evidence"},{tool:"CLAP survey app",users:"Insurer surveyors",does:"GPS photo/video survey forms",gap:"Only useful once a surveyor shows up"},{tool:"CROPIC",users:"Government",does:"Geotagged crop photo time series",gap:"No public dashboard; data never returns to the farmer"},{tool:"YES-TECH / Krishi-DSS",users:"States",does:"Village-level yield estimation, geospatial layers",gap:"Not farm-level; government-facing"},{tool:"Bharat-VISTAAR / Kisan e-Mitra",users:"Farmers",does:"AI advice and scheme information",gap:"Inform only; don't file or track loss reports"}],noneDo:["Tell the farmer an event has started their 72-hour clock","Pre-fill the loss report from the policy receipt and land record","Give the farmer independent, time-stamped evidence (satellite before/after, rainfall, verified photos)","Run the 48-hour / 10-day / 15-day / 7-day deadline timers and escalate automatically","Produce the dispute pack 'with proofs/data/reports' the district committee requires"],actions:[{step:"Report (step 2)",action:"Read the policy receipt photo, snap the field outline from a pin, check the state's notified cover, start the 72-hour clock",output:"Completed loss report in Odia/Hindi plus English, a 14447 call script, reference number captured"},{step:"Evidence (steps 3-4)",action:"Pull Sentinel-1 radar on each pass, Sentinel-2 vegetation after water recedes, rainfall; verify photo GPS and time",output:"PDF evidence pack: water over the plot for N days, vegetation drop vs neighbours, rainfall spike, verified photos"},{step:"Disputes (step 6)",action:"Watch deadlines and draft escalations",output:"Letters on day 2 (no assessor), day 12 (no assessment), day 27 (no payment, 12% interest); 7-day dispute notice with evidence"},{step:"Payment (step 7)",action:"Explain each credit",output:"Which crop and instalment, and the expected final settlement date"}],stepIn:"At steps 1, 2, 3 and 6. The main users are village intermediaries (Krishi Sakhis, CSC operators, FPO staff, bank correspondents), with WhatsApp voice for farmers directly. Possible payers: state agriculture departments (they run the dispute committees), insurers (they pay survey costs and 12% penalties), FPOs.",whyMissed:"Every tool in the system serves the insurer or the state. Nobody builds the farmer's side of the file.",persona:"Sabitri Behera (fictional), 0.8 ha of paddy in Jajpur, Odisha; non-loanee farmer enrolled through a CSC before the 31 Jul deadline. Her field has been underwater since 15 Aug 2026.",script:[{t:"0-10 s",line:"Hook: 'Sabitri's paddy has been underwater since 15 August. PMFBY gives her 72 hours to report. The helpline is busy.'"},{t:"10-30 s",line:"She sends an Odia voice note. The agent reads her policy receipt, snaps her field outline, confirms paddy inundation is notified this season, and shows the countdown."},{t:"30-55 s",line:"Radar before the flood and on two later passes shows water over her plot for 6+ days; rainfall chart shows the spike; her photo is verified as inside the plot and after the event."},{t:"55-75 s",line:"A pre-filled report in Odia and English goes out, the 14447 reference is logged, and the evidence pack PDF is saved."},{t:"75-90 s",line:"Day 3, no assessor appointed: an escalation letter goes to the District Grievance Officer. Close: 'Evidence that used to wash away now stays.'"}],credibility:"Use satellites as corroboration, not as the loss calculator. Sentinel-1 flood mapping in India reaches ~90-94% accuracy at regional scale (Bihar, Kerala); Sentinel-2 vegetation indices correlate with hail damage (r = -0.86 wheat). India already uses remote sensing in PMFBY (binding 70:30 weighting in disputes). Limits: smallholder plots are ~40 pixels, floods shorter than the 6-day revisit can be missed, monsoon cloud blocks optical imagery, and remote sensing can't see post-harvest losses.",demo:"Odisha (Jajpur) floods, 13-26 Aug 2026 (102,481 ha of paddy damaged), with Ganjam (Sep 2026) as backup. Use the Rajasthan quotes on the 'status quo hurts' slide.",data:"Sentinel-1 GRD (6-day revisit restored Jun 2026), Sentinel-2, CHIRPS / GPM rainfall, Google ALU field boundaries, PMFBY Revamped Operational Guidelines",stack:"Earth Engine, Gemini multimodal + Live, ADK, BigQuery (claims ledger + deadlines), Cloud Run",risk:"Judges may have seen 'satellite + crop insurance'; differentiate on the rule-precise workflow and deadline escalation, not the imagery. No public insurance-portal API, so filing is simulated.",notes:["Don'
